                    <p style={{ fontSize: '10pt', fontStyle: 'italic' }}>No hay actividades registradas en su agenda.</p>
                  ) : (
                    <table className="print-table">
                      <thead>
                        <tr>
                          <th>Fecha</th>
                          <th>Horario</th>
                          <th>Actividad</th>
                          <th>Tipo</th>
                          <th>Cliente</th>
                          <th>Estado</th>
                        </tr>
                      </thead>
                      <tbody>
                        {db.agenda
                          .filter(a => a.employeeId === selectedEmp.id)
                          .map((act, idx) => (
                            <tr key={idx}>
                              <td>{act.date}</td>
                              <td>{act.time}</td>
                              <td>{act.title}</td>
                              <td>{act.type}</td>
                              <td>{act.clientName || 'Interno'}</td>
                              <td>{act.status}</td>
                            </tr>
                          ))}
                      </tbody>
                    </table>
                  )}
                </div>
              </div>
            )}
          </div>
        );
      }

      // 10. ANALYTICS (SVG GAUGE & BARS)
      function Analytics() {
        const { db } = useContext(AppContext);
        const [searchAnyDesk, setSearchAnyDesk] = useState('');
        const [toastMsg, setToastMsg] = useState('');

        if (!db) return null;

        const triggerToast = (msg) => {
          setToastMsg(msg);
          setTimeout(() => {
            setToastMsg('');
          }, 2000);
        };

        const clients = db.clients || [];
        const tickets = db.tickets || [];

        // 1. DB Engines: SQL vs DBF
        const sqlCount = clients.filter(c => c.dbType === 'SQL').length;
        const dbfCount = clients.filter(c => c.dbType === 'DBF' || !c.dbType).length;
        const totalClients = clients.length || 1;
        const sqlPercent = Math.round((sqlCount / totalClients) * 100);
        const dbfPercent = Math.round((dbfCount / totalClients) * 100);

        // 2. SLA support hours per client (assume 2 hours per ticket by default)
        const clientHours = {};
        tickets.forEach(t => {
          const hours = t.hours || 2;
          clientHours[t.clientId] = (clientHours[t.clientId] || 0) + hours;
        });

        const slaWarnings = clients.map(c => ({
          id: c.id,
          name: c.commercialName,
          hours: clientHours[c.id] || 0
        })).filter(c => c.hours > 10);

        // 3. Fiscal Printer brands failure tracking
        const fiscalPrinters = {
          Bixolon: 0,
          HKA: 0,
          Custom: 0,
          'The Factory': 0,
          Otros: 0
        };
        tickets.forEach(t => {
          const desc = (t.description || '').toLowerCase() + ' ' + (t.title || '').toLowerCase();
          if (desc.includes('bixolon')) {
            fiscalPrinters.Bixolon++;
          } else if (desc.includes('hka')) {
            fiscalPrinters.HKA++;
          } else if (desc.includes('custom')) {
            fiscalPrinters.Custom++;
          } else if (desc.includes('the factory') || desc.includes('tfh') || desc.includes('factory')) {
            fiscalPrinters['The Factory']++;
          } else if (desc.includes('fiscal') || desc.includes('impresora')) {
            fiscalPrinters.Otros++;
          }
        });
        const maxFiscalCount = Math.max(...Object.values(fiscalPrinters), 1);

        // 4. Common Pathologies (Keywords scan)
        const pathologies = {
          'Errores de Rango': 0,
          'Corrupción DBF': 0,
          'Falla Fiscal': 0,
          'Red / Conectividad': 0
        };
        tickets.forEach(t => {
          const desc = (t.description || '').toLowerCase() + ' ' + (t.title || '').toLowerCase();
          if (desc.includes('rango') || desc.includes('indice') || desc.includes('index')) {
            pathologies['Errores de Rango']++;
          }
          if (desc.includes('tabla') || desc.includes('corrupt') || desc.includes('dbf') || desc.includes('cdx')) {
            pathologies['Corrupción DBF']++;
          }
          if (desc.includes('fiscal') || desc.includes('impresora') || desc.includes('papel') || desc.includes('error 40')) {
            pathologies['Falla Fiscal']++;
          }
          if (desc.includes('red') || desc.includes('conexion') || desc.includes('vpn') || desc.includes('servidor') || desc.includes('anydesk')) {
            pathologies['Red / Conectividad']++;
          }
        });
        const totalPathologies = Object.values(pathologies).reduce((a, b) => a + b, 0) || 1;

        // 5. Gather all AnyDesk info of all servers
        const allServers = clients.flatMap(c => {
          const servers = (c.infrastructure && c.infrastructure.servers) || [];
          return servers.map(s => ({
            clientName: c.commercialName,
            clientId: c.id,
            name: s.name,
            ip: s.ip,
            type: s.type || 'Soporte',
            version: s.version || '1.0',
            anydesk: s.anydesk || ''
          }));
        });

        const filteredServers = allServers.filter(s => {
          const term = searchAnyDesk.toLowerCase();
          return s.clientName.toLowerCase().includes(term) ||
                 s.name.toLowerCase().includes(term) ||
                 s.anydesk.toLowerCase().includes(term) ||
                 s.ip.toLowerCase().includes(term);
        });

        const handleExportAnyDesk = () => {
          const text = allServers.map(s => `${s.clientName} | ${s.name} | AnyDesk: ${s.anydesk || 'N/A'} | IP: ${s.ip}`).join('\n');
          navigator.clipboard.writeText(text);
          triggerToast('¡Directorio AnyDesk copiado en portapapeles!');
        };

        const copyToClipboard = (text, msg) => {
          navigator.clipboard.writeText(text);
          triggerToast(msg);
        };

        const sqlQuery1 = `SELECT 
    c.FI_CODIGO AS Codigo,
    c.FI_DESCRIPCION AS Cliente,
    COUNT(t.id_ticket) AS Total_Fallas,
    SUM(t.horas_invertidas) AS Horas_Soporte
FROM a2_db.dbo.SCLIENTES c
INNER JOIN jc_portal.dbo.PORTAL_TICKETS t ON c.FI_CODIGO = t.cod_cliente
WHERE t.fecha_registro >= DATEADD(month, -1, GETDATE())
GROUP BY c.FI_CODIGO, c.FI_DESCRIPCION
ORDER BY Total_Fallas DESC;`;

        const sqlQuery2 = `SELECT 
    CASE 
        WHEN t.descripcion LIKE '%rango%' THEN 'Error de Rango / Índices'
        WHEN t.descripcion LIKE '%tabla%' OR t.descripcion LIKE '%corrup%' THEN 'Corrupción de Tablas DBF'
        WHEN t.descripcion LIKE '%impresora%' OR t.descripcion LIKE '%fiscal%' THEN 'Falla de Impresora Fiscal'
        ELSE 'Otros Soporte Operativos'
    END AS Patologia,
    COUNT(*) AS Cantidad,
    AVG(t.horas_invertidas) AS Promedio_Horas_Resolucion
FROM jc_portal.dbo.PORTAL_TICKETS t
GROUP BY 
    CASE 
        WHEN t.descripcion LIKE '%rango%' THEN 'Error de Rango / Índices'
        WHEN t.descripcion LIKE '%tabla%' OR t.descripcion LIKE '%corrup%' THEN 'Corrupción de Tablas DBF'
        WHEN t.descripcion LIKE '%impresora%' OR t.descripcion LIKE '%fiscal%' THEN 'Falla de Impresora Fiscal'
        ELSE 'Otros Soporte Operativos'
    END
ORDER BY Cantidad DESC;`;

        return (
          <div className="page-container" style={{ position: 'relative' }}>
            {toastMsg && (
              <div style={{
                position: 'fixed',
                top: '20px',
                right: '20px',
                backgroundColor: 'var(--success)',
                color: '#fff',
                padding: '10px 20px',
                borderRadius: 'var(--radius-xs)',
                zIndex: 9999,
                fontWeight: 'bold',
                boxShadow: '0 4px 12px rgba(0,230,115,0.3)'
              }}>
                {toastMsg}
              </div>
            )}

            <div style={{ marginBottom: '20px' }}>
              <h1 style={{ fontSize: '1.5rem', fontWeight: 800 }}>Reportes e Indicadores de Gestión</h1>
              <p style={{ fontSize: '0.875rem', color: 'var(--text-muted)' }}>
                Cuadro de mando e integración analítica con bases de datos de a2 Softway y AnyDesk.
              </p>
            </div>

            <div className="metrics-grid" style={{ marginBottom: '20px' }}>
              <div className="metric-card primary">
                <span className="metric-title">Distribución BD Clientes</span>
                <div style={{ marginTop: '6px', display: 'flex', flexDirection: 'column', gap: '4px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.75rem' }}>
                    <span>SQL Server: {sqlCount} ({sqlPercent}%)</span>
                    <span>DBF (Archivos): {dbfCount} ({dbfPercent}%)</span>
                  </div>
                  <div style={{ width: '100%', height: '6px', backgroundColor: 'rgba(255,255,255,0.1)', borderRadius: '3px', overflow: 'hidden', display: 'flex' }}>
                    <div style={{ width: `${sqlPercent}%`, backgroundColor: 'var(--primary)' }} />
                    <div style={{ width: `${dbfPercent}%`, backgroundColor: 'var(--info)' }} />
                  </div>
                </div>
              </div>

              <div className="metric-card warning">
                <span className="metric-title">Alertas SLA de Horas</span>
                <div className="metric-value">{slaWarnings.length}</div>
                <span className="metric-trend" style={{ color: 'var(--warning)', fontSize: '0.75rem' }}>
                  ⚠️ Clientes con &gt;10 hrs de soporte
                </span>
              </div>

              <div className="metric-card success">
                <span className="metric-title">Efectividad de Soporte</span>
                <div className="metric-value">
                  {tickets.length ? Math.round((tickets.filter(t => t.status === 'Cerrado').length / tickets.length) * 100) : 100}%
                </div>
                <span className="metric-trend" style={{ color: 'var(--success)', fontSize: '0.75rem' }}>
                  Tickets resueltos vs abiertos
                </span>
              </div>
            </div>

            <div className="grid-cols-2" style={{ gap: '20px', marginBottom: '20px' }}>
              <div className="card">
                <h3 style={{ fontSize: '0.9rem', marginBottom: '12px' }}>Fallas por Impresora Fiscal</h3>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                  {Object.entries(fiscalPrinters).map(([brand, count]) => {
                    const width = (count / maxFiscalCount) * 100;
                    return (
                      <div key={brand} style={{ display: 'flex', flexDirection: 'column', gap: '2px' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.75rem' }}>
                          <span>{brand}</span>
                          <span>{count} fallas</span>
                        </div>
                        <div style={{ height: '6px', backgroundColor: 'var(--background)', borderRadius: '3px', overflow: 'hidden' }}>
                          <div style={{ width: `${width}%`, height: '100%', backgroundColor: 'var(--primary)' }} />
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              <div className="card">
                <h3 style={{ fontSize: '0.9rem', marginBottom: '12px' }}>Patologías de Software</h3>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                  {Object.entries(pathologies).map(([name, count], idx) => {
                    const colors = ['var(--primary)', 'var(--info)', 'var(--warning)', 'var(--danger)'];
                    const pct = Math.round((count / totalPathologies) * 100);
                    return (
                      <div key={name} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: '0.75rem' }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                          <span style={{ width: '8px', height: '8px', borderRadius: '50%', backgroundColor: colors[idx % colors.length] }} />
                          <span>{name}</span>
                        </div>
                        <span style={{ color: 'var(--text-muted)' }}>{count} ({pct}%)</span>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>

            {/* AnyDesk Connection Directory */}
            <div className="card" style={{ marginBottom: '20px' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px', flexWrap: 'wrap', gap: '10px' }}>
                <div>
                  <h3 style={{ fontSize: '0.9rem' }}>Directorio AnyDesk de Servidores</h3>
                  <span style={{ fontSize: '0.7rem', color: 'var(--text-muted)' }}>IPs y AnyDesk rápidos de soporte técnico.</span>
                </div>
                <div style={{ display: 'flex', gap: '8px' }}>
                  <input
                    type="text"
                    placeholder="Filtrar servidor..."
                    className="form-input"
                    style={{ width: '180px', padding: '4px 8px', fontSize: '0.75rem' }}
                    value={searchAnyDesk}
                    onChange={e => setSearchAnyDesk(e.target.value)}
                  />
                  <button className="btn btn-secondary" style={{ padding: '4px 8px', fontSize: '0.75rem' }} onClick={handleExportAnyDesk}>
                    📋 Exportar
                  </button>
                </div>
              </div>

              {filteredServers.length === 0 ? (
                <div style={{ textAlign: 'center', padding: '20px', color: 'var(--text-muted)', fontSize: '0.75rem' }}>
                  No hay servidores que coincidan con la búsqueda.
                </div>
              ) : (
                <div className="table-wrapper">
                  <table className="data-table">
                    <thead>
                      <tr>
                        <th>Cliente</th>
                        <th>Servidor</th>
                        <th>IP Local</th>
                        <th>Tipo (Ver)</th>
                        <th>ID AnyDesk</th>
                        <th>Copiar</th>
                      </tr>
                    </thead>
                    <tbody>
                      {filteredServers.map((srv, idx) => (
                        <tr key={idx}>
                          <td style={{ fontWeight: 'bold' }}>{srv.clientName}</td>
                          <td>{srv.name}</td>
                          <td style={{ fontFamily: 'monospace', fontSize: '0.75rem' }}>{srv.ip}</td>
                          <td>{srv.type} ({srv.version})</td>
                          <td style={{ color: 'var(--success)', fontWeight: 'bold', fontFamily: 'monospace' }}>
                            {srv.anydesk || 'N/A'}
                          </td>
                          <td>
                            {srv.anydesk ? (
                              <button
                                className="btn btn-secondary"
                                style={{ padding: '2px 6px', fontSize: '0.65rem', minWidth: 'auto', borderColor: 'var(--success)', color: 'var(--success)' }}
                                onClick={() => copyToClipboard(srv.anydesk, 'ID AnyDesk copiado.')}
                              >
                                Copiar
                              </button>
                            ) : (
                              <span style={{ fontSize: '0.65rem', color: 'var(--text-muted)' }}>N/A</span>
                            )}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>

            {/* SLA Warnings */}
            {slaWarnings.length > 0 && (
              <div className="card" style={{ marginBottom: '20px', border: '1px solid var(--danger)', backgroundColor: 'rgba(230,0,0,0.03)' }}>
                <h3 style={{ fontSize: '0.9rem', color: 'var(--danger)', marginBottom: '8px' }}>⚠️ Alertas SLA de Contratos (Soporte &gt; 10 horas)</h3>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '6px' }}>
                  {slaWarnings.map(c => (
                    <div key={c.id} style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.75rem', backgroundColor: 'var(--background)', padding: '6px 10px', borderRadius: '4px' }}>
                      <strong>{c.name}</strong>
                      <span style={{ color: 'var(--danger)', fontWeight: 'bold' }}>{c.hours} horas consumidas</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* SQL Codes */}
            <div className="card">
              <h3 style={{ fontSize: '0.9rem', marginBottom: '12px' }}>Consultas SQL de Integración a2 Softway</h3>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
                <div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.75rem', marginBottom: '4px', fontWeight: 'bold' }}>
                    <span>1. Fallas y Horas SLA</span>
                    <a href="#" style={{ color: 'var(--primary)' }} onClick={(e) => { e.preventDefault(); copyToClipboard(sqlQuery1, 'Query SQL 1 copiado'); }}>Copiar SQL</a>
                  </div>
                  <pre style={{ margin: 0, padding: '8px', backgroundColor: 'var(--background)', border: '1px solid var(--border)', borderRadius: '4px', fontSize: '0.65rem', overflowX: 'auto', color: '#39ff14', fontFamily: 'monospace', maxHeight: '120px' }}>
                    {sqlQuery1}
                  </pre>
                </div>

                <div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.75rem', marginBottom: '4px', fontWeight: 'bold' }}>
                    <span>2. Patologías Comunes</span>
                    <a href="#" style={{ color: 'var(--primary)' }} onClick={(e) => { e.preventDefault(); copyToClipboard(sqlQuery2, 'Query SQL 2 copiado'); }}>Copiar SQL</a>
                  </div>
                  <pre style={{ margin: 0, padding: '8px', backgroundColor: 'var(--background)', border: '1px solid var(--border)', borderRadius: '4px', fontSize: '0.65rem', overflowX: 'auto', color: '#39ff14', fontFamily: 'monospace', maxHeight: '120px' }}>
                    {sqlQuery2}
                  </pre>
                </div>
              </div>
            </div>

          </div>
        );
      }

      // 11. AUDIT SECURITY LOGS
      function Audit() {
        const { db } = useContext(AppContext);
        if (!db) return null;

        return (
          <div className="page-container">
            <div className="card">
              <h3>🔒 Historial de Auditoría Inmutable</h3>
              <p style={{ fontSize: '0.8125rem', color: 'var(--text-muted)', marginBottom: '16px' }}>Registro en tiempo real sobre accesos a claves y actividades críticas de JC.</p>
              <div className="table-wrapper">
                <table className="data-table">
                  <thead>
                    <tr>
                      <th>Fecha</th>
                      <th>Operador</th>
                      <th>Acción</th>
                      <th>Detalles</th>
                    </tr>
                  </thead>
                  <tbody>
                    {db.auditLogs.map(log => (
                      <tr key={log.id}>
                        <td style={{ fontSize: '0.75rem', fontFamily: 'monospace' }}>{log.timestamp}</td>
                        <td style={{ fontWeight: 'bold' }}>{log.user}</td>
                        <td><span className="badge badge-primary">{log.action}</span></td>
                        <td style={{ fontSize: '0.8125rem', whiteSpace: 'normal' }}>{log.details}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        );
      }

      // ==========================================
      // ENRUTADOR DE VISTAS PRINCIPAL
      // ==========================================
      
      function PortalRouter() {
        const { isAuthenticated, activeTab, loading, splashActive } = useContext(AppContext);

        if (splashActive) {
          return <SplashScreen />;
        }

        if (loading) {
          return (
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', minHeight: '100vh', backgroundColor: 'var(--background)', color: 'var(--text)' }}>
              <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '16px' }}>
                <JCLogo size={64} style={{ color: 'var(--primary)' }} />
                <div>Cargando base de datos segura...</div>
              </div>
            </div>
          );
        }

        if (!isAuthenticated) {
          return <Login />;
        }

        const renderView = () => {
          switch (activeTab) {
            case 'dashboard': return <Dashboard />;
            case 'clients': return <Clients />;
            case 'layouts': return <Layouts />;
            case 'projects': return <Projects />;
            case 'agenda': return <DailyAgenda />;
            case 'tickets': return <Tickets />;
            case 'wiki': return <KnowledgeBase />;
            case 'referrals': return <Referrals />;
            case 'employees': return <Employees />;
            case 'analytics': return <Analytics />;
            case 'audit': return <Audit />;
            default: return <Dashboard />;
          }
        };

        return (
          <div className="app-container">
            <Navigation />
            <div className="main-content">
              <Header />
              {renderView()}
            </div>
          </div>
        );
      }

      function App() {
        return (
          <AppProvider>
            <PortalRouter />
          </AppProvider>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
