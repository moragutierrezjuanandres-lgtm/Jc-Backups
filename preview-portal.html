      // 4. PROJECTS (KANBAN DRAG AND DROP)
      function Projects() {
        const { db, updateTaskStatus, addProject, deleteProject, addTaskToProject, addProjectAnnotation, currentUser } = useContext(AppContext);
        const [activeProject, setActiveProject] = useState(null);
        const [showProjModal, setShowProjModal] = useState(false);
        const [showTaskModal, setShowTaskModal] = useState(false);
        const [annotationText, setAnnotationText] = useState('');

        // Project form
        const [projName, setProjName] = useState('');
        const [projClient, setProjClient] = useState('');
        const [projPriority, setProjPriority] = useState('Media');
        const [projStart, setProjStart] = useState('');
        const [projEnd, setProjEnd] = useState('');

        // Task form
        const [taskTitle, setTaskTitle] = useState('');
        const [taskDesc, setTaskDesc] = useState('');
        const [taskPriority, setTaskPriority] = useState('Media');
        const [taskDeadline, setTaskDeadline] = useState('');
        const [taskAssignee, setTaskAssignee] = useState('');

        if (!db) return null;
        const project = activeProject ? db.projects.find(p => p.id === activeProject.id) : db.projects[0];

        const handleDragStart = (e, id) => {
          e.dataTransfer.setData('text/plain', id);
        };
        const handleDragOver = (e) => e.preventDefault();
        const handleDrop = (e, status) => {
          const taskId = e.dataTransfer.getData('text/plain');
          if (taskId && project) {
            updateTaskStatus(project.id, taskId, status);
          }
        };

        const handleProjSubmit = (e) => {
          e.preventDefault();
          const cli = db.clients.find(c => c.id === projClient);
          addProject({
            name: projName,
            clientId: projClient,
            clientName: cli ? cli.commercialName : 'Interno',
            priority: projPriority,
            startDate: projStart,
            endDate: projEnd
          });
          setShowProjModal(false);
          setProjName(''); setProjClient(''); setProjStart(''); setProjEnd('');
        };

        const handleTaskSubmit = (e) => {
          e.preventDefault();
          const assignee = db.employees.find(emp => emp.id === taskAssignee);
          addTaskToProject(project.id, {
            title: taskTitle,
            description: taskDesc,
            priority: taskPriority,
            deadline: taskDeadline,
            assigneeId: taskAssignee || (currentUser ? currentUser.id : 'master'),
            assigneeName: assignee ? assignee.name : (currentUser ? currentUser.name : 'Master JC')
          });
          setShowTaskModal(false);
          setTaskTitle(''); setTaskDesc(''); setTaskDeadline(''); setTaskAssignee('');
        };

        const handleAddAnnotation = (e) => {
          e.preventDefault();
          if (!annotationText.trim() || !project) return;
          addProjectAnnotation(project.id, annotationText);
          setAnnotationText('');
        };

        return (
          <div className="page-container">
            <div style={{ display: 'grid', gridTemplateColumns: '260px 1fr', gap: '20px' }}>
              <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                <button className="btn btn-primary" style={{ width: '100%' }} onClick={() => setShowProjModal(true)}>
                  ➕ Nuevo Proyecto
                </button>
                {db.projects.map(p => (
                  <div
                    key={p.id}
                    onClick={() => setActiveProject(p)}
                    className="card"
                    style={{ padding: '12px', cursor: 'pointer', backgroundColor: project && project.id === p.id ? 'var(--primary-glow)' : 'var(--card)' }}
                  >
                    <strong>{p.name}</strong>
                    <div style={{ fontSize: '0.7rem', color: 'var(--text-muted)', marginTop: '4px' }}>Avance: {p.progress}%</div>
                  </div>
                ))}
                {db.projects.length === 0 && <p style={{ fontSize: '0.8125rem', color: 'var(--text-muted)', textAlign: 'center', padding: '20px' }}>No hay proyectos. Cree uno para comenzar.</p>}
              </div>

              {project ? (
                <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
                  <div className="card">
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                      <div>
                        <h2>{project.name}</h2>
                        <p style={{ fontSize: '0.8125rem', color: 'var(--text-muted)' }}>Cliente: {project.clientName} | Líder: {project.leadName}</p>
                      </div>
                      <div style={{ display: 'flex', gap: '8px' }}>
                        <button className="btn btn-secondary" style={{ padding: '6px 12px', fontSize: '0.75rem' }} onClick={() => setShowTaskModal(true)}>
                          ➕ Agregar Tarea
                        </button>
                        <button className="btn btn-secondary" style={{ padding: '6px 12px', fontSize: '0.75rem', color: 'var(--danger)' }} onClick={() => {
                          if (confirm(`¿Eliminar el proyecto "${project.name}"?`)) {
                            deleteProject(project.id);
                            setActiveProject(null);
                          }
                        }}>
                          🗑️ Eliminar
                        </button>
                      </div>
                    </div>
                    <div style={{ width: '100%', height: '6px', backgroundColor: 'var(--border)', borderRadius: '10px', marginTop: '10px', overflow: 'hidden' }}>
                      <div style={{ width: `${project.progress}%`, height: '100%', backgroundColor: 'var(--primary)' }}></div>
                    </div>
                  </div>

                  <div style={{ display: 'flex', gap: '12px', overflowX: 'auto' }}>
                    {['Pendiente', 'En proceso', 'Completada'].map(stage => {
                      const tasks = project.tasks.filter(t => t.status === stage);
                      return (
                        <div
                          key={stage}
                          className="kanban-column"
                          onDragOver={handleDragOver}
                          onDrop={(e) => handleDrop(e, stage)}
                          style={{ flex: 1 }}
                        >
                          <div className="kanban-header">
                            <span className="kanban-title">{stage}</span>
                            <span className="kanban-count">{tasks.length}</span>
                          </div>
                          <div className="kanban-cards-wrapper" style={{ minHeight: '200px' }}>
                            {tasks.map(task => (
                              <div
                                key={task.id}
                                className="kanban-card"
                                draggable
                                onDragStart={(e) => handleDragStart(e, task.id)}
                              >
                                <div className="kanban-card-title">{task.title}</div>
                                <div className="kanban-card-meta">
                                  <span>👤 {task.assigneeName ? task.assigneeName.split(' ')[0] : '—'}</span>
                                  <span className="badge badge-primary">{task.priority}</span>
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  {/* Annotations & Progress Updates (Bitácora) */}
                  <div className="card" style={{ display: 'flex', flexDirection: 'column', gap: '16px', marginTop: '16px' }}>
                    <h3 style={{ fontSize: '1rem', borderBottom: '1px solid var(--border)', paddingBottom: '8px', fontWeight: 800 }}>
                      📝 Bitácora de Avances y Anotaciones del Proyecto
                    </h3>
                    
                    {currentUser && currentUser.role !== 'Cliente' && (
                      <form onSubmit={handleAddAnnotation} style={{ display: 'flex', gap: '8px' }}>
                        <input
                          type="text"
                          placeholder="Agregar una anotación técnica o reporte de avance..."
                          className="form-input"
                          value={annotationText}
                          onChange={(e) => setAnnotationText(e.target.value)}
                          style={{ flex: 1 }}
                        />
                        <button type="submit" className="btn btn-primary" style={{ minWidth: '120px' }}>Guardar Nota</button>
                      </form>
                    )}

                    <div style={{ display: 'flex', flexDirection: 'column', gap: '10px', maxHeight: '250px', overflowY: 'auto' }}>
                      {!project.annotations || project.annotations.length === 0 ? (
                        <span style={{ fontSize: '0.8125rem', color: 'var(--text-muted)', fontStyle: 'italic', textAlign: 'center', padding: '20px' }}>
                          No hay anotaciones registradas en este proyecto.
                        </span>
                      ) : (
                        project.annotations.map(ann => (
                          <div key={ann.id} style={{ display: 'flex', flexDirection: 'column', backgroundColor: 'var(--background)', padding: '12px', borderRadius: 'var(--radius-sm)', border: '1px solid var(--border)' }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.75rem', color: 'var(--text-muted)', marginBottom: '4px' }}>
                              <span style={{ fontWeight: 'bold', color: 'var(--primary)' }}>👤 {ann.user}</span>
                              <span>{ann.timestamp}</span>
                            </div>
                            <span style={{ fontSize: '0.875rem', color: 'var(--text)' }}>{ann.content}</span>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                </div>
              ) : (
                <div className="card" style={{ textAlign: 'center', padding: '60px', color: 'var(--text-muted)' }}>
                  <p style={{ fontSize: '1.1rem', marginBottom: '8px' }}>📁 Sin proyectos activos</p>
                  <p>Cree un nuevo proyecto para comenzar a gestionar tareas con el tablero Kanban.</p>
                </div>
              )}
            </div>

            {/* Project Modal */}
            {showProjModal && (
              <div className="modal-overlay">
                <div className="modal-content">
                  <div className="modal-header">
                    <h3>Crear Nuevo Proyecto</h3>
                    <button className="btn btn-secondary" style={{ padding: '4px 8px' }} onClick={() => setShowProjModal(false)}>✕</button>
                  </div>
                  <form onSubmit={handleProjSubmit}>
                    <div className="modal-body">
                      <div className="form-group">
                        <label className="form-label">Nombre del Proyecto</label>
                        <input type="text" className="form-input" value={projName} onChange={e => setProjName(e.target.value)} required placeholder="ej: Migración Cloud AWS" />
                      </div>
                      <div className="form-group">
                        <label className="form-label">Cliente Asociado</label>
                        <select className="form-select" value={projClient} onChange={e => setProjClient(e.target.value)}>
                          <option value="">Interno (sin cliente)</option>
                          {db.clients.map(c => <option key={c.id} value={c.id}>{c.commercialName}</option>)}
                        </select>
                      </div>
                      <div className="grid-cols-2">
                        <div className="form-group">
                          <label className="form-label">Prioridad</label>
                          <select className="form-select" value={projPriority} onChange={e => setProjPriority(e.target.value)}>
                            <option value="Urgente">Urgente</option>
                            <option value="Alta">Alta</option>
                            <option value="Media">Media</option>
                            <option value="Baja">Baja</option>
                          </select>
                        </div>
                        <div className="form-group">
                          <label className="form-label">Fecha Inicio</label>
                          <input type="date" className="form-input" value={projStart} onChange={e => setProjStart(e.target.value)} />
                        </div>
                      </div>
                      <div className="form-group">
                        <label className="form-label">Fecha Fin Estimada</label>
                        <input type="date" className="form-input" value={projEnd} onChange={e => setProjEnd(e.target.value)} />
                      </div>
                    </div>
                    <div className="modal-footer">
                      <button type="button" className="btn btn-secondary" onClick={() => setShowProjModal(false)}>Cancelar</button>
                      <button type="submit" className="btn btn-primary">Crear Proyecto</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* Task Modal */}
            {showTaskModal && (
              <div className="modal-overlay">
                <div className="modal-content">
                  <div className="modal-header">
                    <h3>Agregar Tarea al Proyecto</h3>
                    <button className="btn btn-secondary" style={{ padding: '4px 8px' }} onClick={() => setShowTaskModal(false)}>✕</button>
                  </div>
                  <form onSubmit={handleTaskSubmit}>
                    <div className="modal-body">
                      <div className="form-group">
                        <label className="form-label">Título de la Tarea</label>
                        <input type="text" className="form-input" value={taskTitle} onChange={e => setTaskTitle(e.target.value)} required placeholder="ej: Configurar subredes VPC" />
                      </div>
                      <div className="form-group">
                        <label className="form-label">Descripción</label>
                        <textarea className="form-textarea" rows="3" value={taskDesc} onChange={e => setTaskDesc(e.target.value)} placeholder="Detalles de la tarea..."></textarea>
                      </div>
                      <div className="grid-cols-2">
                        <div className="form-group">
                          <label className="form-label">Prioridad</label>
                          <select className="form-select" value={taskPriority} onChange={e => setTaskPriority(e.target.value)}>
                            <option value="Urgente">Urgente</option>
                            <option value="Alta">Alta</option>
                            <option value="Media">Media</option>
                            <option value="Baja">Baja</option>
                          </select>
                        </div>
                        <div className="form-group">
                          <label className="form-label">Fecha Límite</label>
                          <input type="date" className="form-input" value={taskDeadline} onChange={e => setTaskDeadline(e.target.value)} />
                        </div>
                      </div>
                      <div className="form-group">
                        <label className="form-label">Asignar a</label>
                        <select className="form-select" value={taskAssignee} onChange={e => setTaskAssignee(e.target.value)}>
                          <option value="">Yo mismo</option>
                          {db.employees.filter(e => e.status === 'Activo').map(emp => <option key={emp.id} value={emp.id}>{emp.name} ({emp.role})</option>)}
                        </select>
                      </div>
                    </div>
                    <div className="modal-footer">
                      <button type="button" className="btn btn-secondary" onClick={() => setShowTaskModal(false)}>Cancelar</button>
                      <button type="submit" className="btn btn-primary">Agregar Tarea</button>
                    </div>
                  </form>
                </div>
              </div>
            )}
          </div>
        );
      }

      function DailyAgenda() {
        const { db, updateAgendaStatus, addAgendaItem, updateAgendaItem, deleteAgendaItem, rescheduleAgendaItem, currentUser } = useContext(AppContext);
        if (!db || !currentUser) return null;

        const isMaster = currentUser.role === 'Administrador';
        const isAdminOrGerente = isMaster || currentUser.role === 'Gerente';

        const [filterEmpId, setFilterEmpId] = useState(currentUser.id);
        const [showAddEvent, setShowAddEvent] = useState(false);
        const [rescheduleEvt, setRescheduleEvt] = useState(null);
        const [rescheduleDate, setRescheduleDate] = useState('');

        // Edit Event States
        const [editingEvt, setEditingEvt] = useState(null);
        const [editTitle, setEditTitle] = useState('');
        const [editType, setEditType] = useState('Visita técnica');
        const [editDate, setEditDate] = useState('');
        const [editTime, setEditTime] = useState('');
        const [editClient, setEditClient] = useState('');
        const [editAssignee, setEditAssignee] = useState('');

        // Form states
        const [evtTitle, setEvtTitle] = useState('');
        const [evtType, setEvtType] = useState('Visita técnica');
        const [evtDate, setEvtDate] = useState(new Date().toISOString().split('T')[0]);
        const [evtTime, setEvtTime] = useState('09:00 - 11:00');
        const [evtClient, setEvtClient] = useState('');
        const [evtAssignee, setEvtAssignee] = useState(currentUser.id);

        // Sync when currentUser changes
        useEffect(() => {
          if (currentUser) {
            setEvtAssignee(currentUser.id);
            setFilterEmpId(currentUser.id);
          }
        }, [currentUser]);

        const activeViewId = isAdminOrGerente ? filterEmpId : currentUser.id;
        const filteredAgenda = db.agenda.filter(item => item.employeeId === activeViewId);
        const selectedEmpObj = db.employees.find(e => e.id === activeViewId);

        // Split tasks into Pending and Completed/Cancelled
        const pendingTasks = filteredAgenda.filter(act => act.status !== 'Completado' && act.status !== 'Cancelado');
        const completedTasks = filteredAgenda.filter(act => act.status === 'Completado' || act.status === 'Cancelado');

        const renderAgendaItem = (act) => (
          <div key={act.id} className="agenda-item" style={{ padding: '16px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <div className="agenda-info" style={{ gap: '12px' }}>
              <div style={{
                width: '12px',
                height: '12px',
                borderRadius: '50%',
                backgroundColor: act.status === 'Completado' ? 'var(--success)' :
                                act.status === 'Reprogramado' ? 'var(--warning)' :
                                act.status === 'Cancelado' ? 'var(--danger)' : 'var(--info)'
              }}></div>
              <div>
                <span style={{ 
                  fontWeight: 'bold', 
                  textDecoration: act.status === 'Completado' ? 'line-through' : 'none',
                  color: act.status === 'Completado' ? 'var(--text-muted)' : 'var(--text)'
                }}>
                  {act.title}
                </span>
                <div className="agenda-meta" style={{ gap: '10px', marginTop: '2px', fontSize: '0.75rem', color: 'var(--text-muted)' }}>
                  <span className="badge badge-info">{act.type}</span>
                  <span>📅 {act.date}</span>
                  <span>🕒 {act.time}</span>
                  {act.clientName && <span>🏢 {act.clientName}</span>}
                </div>
              </div>
            </div>

            <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
              {(isAdminOrGerente || currentUser.id === act.employeeId) ? (
                <>
                  <button 
                    className="btn btn-secondary" 
                    style={{ padding: '4px 8px', fontSize: '0.7rem' }} 
                    onClick={() => updateAgendaStatus(act.id, 'Completado')}
                    disabled={act.status === 'Completado'}
                  >
                    ✓ Completar
                  </button>
                  <button 
                    className="btn btn-secondary" 
                    style={{ padding: '4px 8px', fontSize: '0.7rem' }} 
                    onClick={() => openEditModal(act)}
                  >
                    ✏️ Editar
                  </button>
                  <button 
                    className="btn btn-secondary" 
                    style={{ padding: '4px 8px', fontSize: '0.7rem', color: 'var(--danger)' }} 
                    onClick={() => {
                      if (confirm('¿Desea cancelar esta actividad?')) {
                        updateAgendaStatus(act.id, 'Cancelado');
                      }
                    }}
                    disabled={act.status === 'Cancelado'}
                  >
                    ✕ Cancelar
                  </button>
                </>
              ) : (
                <span style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>Sin acciones</span>
              )}
            </div>
          </div>
        );

        const handleAddSubmit = (e) => {
          e.preventDefault();
          if (!evtTitle) return;

          const clientObj = db.clients.find(c => c.id === evtClient);
          addAgendaItem({
            employeeId: evtAssignee,
            title: evtTitle,
            type: evtType,
            date: evtDate,
            time: evtTime,
            clientId: evtClient,
            clientName: clientObj ? clientObj.commercialName : 'Interno'
          });

          setEvtTitle('');
          setShowAddEvent(false);
        };

        const handleRescheduleSubmit = (e) => {
          e.preventDefault();
          if (!rescheduleEvt || !rescheduleDate) return;
          rescheduleAgendaItem(rescheduleEvt.id, rescheduleDate);
          setRescheduleEvt(null);
        };

        const openEditModal = (act) => {
          setEditingEvt(act);
          setEditTitle(act.title);
          setEditType(act.type);
          setEditDate(act.date);
          setEditTime(act.time);
          setEditClient(act.clientId || '');
          setEditAssignee(act.employeeId || '');
        };

        const handleEditSubmit = (e) => {
          e.preventDefault();
          if (!editingEvt || !editTitle) return;

          const clientObj = db.clients.find(c => c.id === editClient);
          updateAgendaItem(editingEvt.id, {
            title: editTitle,
            type: editType,
            date: editDate,
            time: editTime,
            clientId: editClient,
            clientName: clientObj ? clientObj.commercialName : 'Interno',
            employeeId: editAssignee
          });

          setEditingEvt(null);
        };

        return (
          <div className="page-container">
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <div>
                <h1>Planificación Diaria</h1>
                <p style={{ fontSize: '0.875rem', color: 'var(--text-muted)' }}>Agenda de visitas y servicios técnicos.</p>
              </div>
              {(isAdminOrGerente || currentUser.role === 'Técnico') && (
                <button className="btn btn-primary" onClick={() => setShowAddEvent(true)}>
                  + Programar Actividad
                </button>
              )}
            </div>

            {isAdminOrGerente && (
              <div className="card" style={{ display: 'flex', alignItems: 'center', gap: '16px', padding: '16px' }}>
                <span className="form-label" style={{ fontSize: '0.8125rem' }}>Visualizar agenda de:</span>
                <select
                  className="form-select"
                  style={{ width: 'auto', padding: '8px 12px' }}
                  value={filterEmpId}
                  onChange={(e) => setFilterEmpId(e.target.value)}
                >
                  {db.employees.map(emp => (
                    <option key={emp.id} value={emp.id}>{emp.name} ({emp.role})</option>
                  ))}
                </select>
              </div>
            )}

            <div className="card" style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
              <h3 style={{ borderBottom: '1px solid var(--border)', paddingBottom: '8px' }}>Actividades Agendadas - {selectedEmpObj ? selectedEmpObj.name : currentUser.name}</h3>
              
              {/* Bloque: Tareas Pendientes */}
              <div>
                <h4 style={{ fontSize: '0.9rem', color: 'var(--primary)', marginBottom: '8px', display: 'flex', alignItems: 'center', gap: '8px' }}>
                  <span>📋 Actividades Pendientes</span>
                  <span className="badge badge-primary" style={{ padding: '2px 6px', fontSize: '0.65rem' }}>{pendingTasks.length}</span>
                </h4>
                {pendingTasks.length === 0 ? (
                  <p style={{ fontSize: '0.8125rem', color: 'var(--text-muted)', textAlign: 'center', padding: '12px', border: '1px dashed var(--border)', borderRadius: 'var(--radius-sm)' }}>No hay actividades pendientes.</p>
                ) : (
                  <div className="agenda-list">
                    {pendingTasks.map(act => renderAgendaItem(act))}
                  </div>
                )}
              </div>

              {/* Bloque: Tareas Completadas */}
              <div>
                <h4 style={{ fontSize: '0.9rem', color: 'var(--success)', marginBottom: '8px', display: 'flex', alignItems: 'center', gap: '8px' }}>
                  <span>✅ Actividades Finalizadas</span>
                  <span className="badge badge-success" style={{ padding: '2px 6px', fontSize: '0.65rem', backgroundColor: 'rgba(0, 230, 115, 0.1)', color: 'var(--success)' }}>{completedTasks.length}</span>
                </h4>
                {completedTasks.length === 0 ? (
                  <p style={{ fontSize: '0.8125rem', color: 'var(--text-muted)', textAlign: 'center', padding: '12px', border: '1px dashed var(--border)', borderRadius: 'var(--radius-sm)' }}>No hay actividades finalizadas.</p>
                ) : (
                  <div className="agenda-list">
                    {completedTasks.map(act => renderAgendaItem(act))}
                  </div>
                )}
              </div>
            </div>

            {/* Modal: Add Event */}
            {showAddEvent && (
              <div className="modal-overlay" style={{
                position: 'fixed', inset: 0, zIndex: 1000,
                backgroundColor: 'rgba(0,0,0,0.6)', backdropFilter: 'blur(4px)',
                display: 'flex', alignItems: 'center', justifyContent: 'center'
              }}>
                <div className="card" style={{ width: '100%', maxWidth: '480px', margin: '20px', zIndex: 1001 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px', borderBottom: '1px solid var(--border)', paddingBottom: '12px' }}>
                    <h3 style={{ fontWeight: 800 }}>Programar Actividad</h3>
                    <button className="btn btn-secondary" onClick={() => setShowAddEvent(false)} style={{ padding: '4px 8px', minWidth: 'auto', border: 'none', background: 'none' }}>✕</button>
                  </div>
                  <form onSubmit={handleAddSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '14px' }}>
                    <div className="form-group">
                      <label className="form-label">Título de la Actividad</label>
                      <input type="text" className="form-input" required placeholder="ej. Instalación de Switch Core" value={evtTitle} onChange={e => setEvtTitle(e.target.value)} />
                    </div>
                    <div className="form-group">
                      <label className="form-label">Tipo de Servicio</label>
                      <select className="form-select" value={evtType} onChange={e => setEvtType(e.target.value)}>
                        <option value="Visita técnica">Visita técnica</option>
                        <option value="Soporte remoto">Soporte remoto</option>
                        <option value="Capacitación">Capacitación</option>
                        <option value="Desarrollo">Desarrollo</option>
                        <option value="Instalación">Instalación</option>
                      </select>
                    </div>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
                      <div className="form-group">
                        <label className="form-label">Fecha</label>
                        <input type="date" className="form-input" required value={evtDate} onChange={e => setEvtDate(e.target.value)} />
                      </div>
                      <div className="form-group">
                        <label className="form-label">Bloque de Horario</label>
                        <input type="text" className="form-input" required placeholder="ej. 09:00 - 12:00" value={evtTime} onChange={e => setEvtTime(e.target.value)} />
                      </div>
                    </div>
                    <div className="form-group">
                      <label className="form-label">Cliente Asociado</label>
                      <select className="form-select" value={evtClient} onChange={e => setEvtClient(e.target.value)}>
                        <option value="">Servicio Interno (Sin cliente)</option>
                        {db.clients.map(c => <option key={c.id} value={c.id}>{c.commercialName}</option>)}
                      </select>
                    </div>
                    <div className="form-group">
                      <label className="form-label">Asignar a Empleado</label>
                      <select className="form-select" required value={evtAssignee} onChange={e => setEvtAssignee(e.target.value)} disabled={!isAdminOrGerente}>
                        {db.employees.map(emp => <option key={emp.id} value={emp.id}>{emp.name}</option>)}
                      </select>
                    </div>
                    <div style={{ display: 'flex', gap: '12px', justifyContent: 'flex-end', borderTop: '1px solid var(--border)', paddingTop: '16px', marginTop: '8px' }}>
                      <button type="button" className="btn btn-secondary" onClick={() => setShowAddEvent(false)}>Cancelar</button>
                      <button type="submit" className="btn btn-primary">Asignar Agenda</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* Modal: Reschedule */}
            {rescheduleEvt && (
              <div className="modal-overlay" style={{
                position: 'fixed', inset: 0, zIndex: 1000,
                backgroundColor: 'rgba(0,0,0,0.6)', backdropFilter: 'blur(4px)',
                display: 'flex', alignItems: 'center', justifyContent: 'center'
              }}>
                <div className="card" style={{ width: '100%', maxWidth: '400px', margin: '20px', zIndex: 1001 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px', borderBottom: '1px solid var(--border)', paddingBottom: '12px' }}>
                    <h3 style={{ fontWeight: 800 }}>Reprogramar Actividad</h3>
                    <button className="btn btn-secondary" onClick={() => setRescheduleEvt(null)} style={{ padding: '4px 8px', minWidth: 'auto', border: 'none', background: 'none' }}>✕</button>
                  </div>
                  <form onSubmit={handleRescheduleSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '14px' }}>
                    <p style={{ fontSize: '0.8125rem', color: 'var(--text-muted)' }}>
                      Nueva fecha para: <strong>{rescheduleEvt.title}</strong>
                    </p>
                    <div className="form-group">
                      <label className="form-label">Nueva Fecha</label>
                      <input type="date" className="form-input" required value={rescheduleDate} onChange={e => setRescheduleDate(e.target.value)} />
                    </div>
                    <div style={{ display: 'flex', gap: '12px', justifyContent: 'flex-end', borderTop: '1px solid var(--border)', paddingTop: '16px', marginTop: '8px' }}>
                      <button type="button" className="btn btn-secondary" onClick={() => setRescheduleEvt(null)}>Cancelar</button>
                      <button type="submit" className="btn btn-primary">Guardar Fecha</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* Modal: Edit Event */}
            {editingEvt && (
              <div className="modal-overlay" style={{
                position: 'fixed', inset: 0, zIndex: 1000,
                backgroundColor: 'rgba(0,0,0,0.6)', backdropFilter: 'blur(4px)',
                display: 'flex', alignItems: 'center', justifyContent: 'center'
              }}>
                <div className="card" style={{ width: '100%', maxWidth: '480px', margin: '20px', zIndex: 1001 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px', borderBottom: '1px solid var(--border)', paddingBottom: '12px' }}>
                    <h3 style={{ fontWeight: 800 }}>Editar Actividad</h3>
                    <button className="btn btn-secondary" onClick={() => setEditingEvt(null)} style={{ padding: '4px 8px', minWidth: 'auto', border: 'none', background: 'none' }}>✕</button>
                  </div>
                  <form onSubmit={handleEditSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '14px' }}>
                    <div className="form-group">
                      <label className="form-label">Título de la Actividad</label>
                      <input type="text" className="form-input" required placeholder="ej. Instalación de Switch Core" value={editTitle} onChange={e => setEditTitle(e.target.value)} />
                    </div>
                    <div className="form-group">
                      <label className="form-label">Tipo de Servicio</label>
                      <select className="form-select" value={editType} onChange={e => setEditType(e.target.value)}>
                        <option value="Visita técnica">Visita técnica</option>
                        <option value="Soporte remoto">Soporte remoto</option>
                        <option value="Capacitación">Capacitación</option>
                        <option value="Desarrollo">Desarrollo</option>
                        <option value="Instalación">Instalación</option>
                      </select>
                    </div>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
                      <div className="form-group">

                      <div className="form-group">

                      <label className="form-label">Cliente Asociado</label>
