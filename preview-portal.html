      // 6. TICKETS
      function Tickets() {
        const { db, setDb, addTicket, updateTicketStatus, currentUser, logActivity, checkRecurringIssues } = useContext(AppContext);
        const [activeTicketId, setActiveTicketId] = useState(null);
        const [newTitle, setNewTitle] = useState('');
        const [newDesc, setNewDesc] = useState('');
        const [newClient, setNewClient] = useState('');
        const [newPriority, setNewPriority] = useState('Alta');
        const [newStation, setNewStation] = useState('');

        if (!db) return null;
        const ticket = db.tickets.find(t => t.id === activeTicketId) || db.tickets[0];

        const handleSubmit = (e) => {
          e.preventDefault();
          if (!newTitle || !newClient) return;
          const cli = db.clients.find(c => c.id === newClient);
          addTicket({
            title: newTitle,
            description: newDesc,
            clientId: newClient,
            clientName: cli ? cli.commercialName : 'Soporte',
            category: 'Infraestructura',
            priority: newPriority,
            station: newStation,
            assigneeId: currentUser ? currentUser.id : 'master',
            assigneeName: currentUser ? currentUser.name : 'Master JC',
            solution: ''
          });
          setNewTitle('');
          setNewDesc('');
          setNewClient('');
          setNewStation('');
        };

        const recurringIssues = checkRecurringIssues ? checkRecurringIssues(newClient, newStation, newDesc) : [];

        return (
          <div className="page-container">
            <div style={{ display: 'grid', gridTemplateColumns: '280px 1fr', gap: '20px' }}>
              <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                <div className="card" style={{ padding: '12px' }}>
                  <form onSubmit={handleSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                    <strong>Nuevo Ticket</strong>
                    <input type="text" placeholder="Asunto del soporte" className="form-input" value={newTitle} onChange={e => setNewTitle(e.target.value)} required />
                    <select className="form-select" value={newClient} onChange={e => setNewClient(e.target.value)} required>
                      <option value="">Seleccionar Cliente...</option>
                      {db.clients.map(c => <option key={c.id} value={c.id}>{c.commercialName}</option>)}
                    </select>
                    <input type="text" placeholder="Estación / Caja (Opcional)" className="form-input" value={newStation} onChange={e => setNewStation(e.target.value)} />
                    <select className="form-select" value={newPriority} onChange={e => setNewPriority(e.target.value)}>
                      <option value="Urgente">🔴 Urgente</option>
                      <option value="Alta">🟠 Alta</option>
                      <option value="Media">🟡 Media</option>
                      <option value="Baja">🟢 Baja</option>
                    </select>
                    <textarea placeholder="Descripción de la falla" rows="3" className="form-textarea" value={newDesc} onChange={e => setNewDesc(e.target.value)}></textarea>
                    
                    {recurringIssues.length > 0 && (
                      <div style={{
                        padding: '10px',
                        backgroundColor: 'rgba(230, 92, 0, 0.08)',
                        border: '1px dashed var(--warning)',
                        borderRadius: 'var(--radius-xs)',
                        fontSize: '0.75rem',
                        marginTop: '4px',
                        marginBottom: '4px'
                      }}>
                        <div style={{ color: 'var(--warning)', fontWeight: 'bold', marginBottom: '6px' }}>
                          ⚠️ Alerta Falla Recurrente ({recurringIssues.length})
                        </div>
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '6px' }}>
                          {recurringIssues.map(issue => (
                            <div key={issue.id} style={{ borderLeft: '2px solid var(--warning)', paddingLeft: '6px' }}>
                              <div style={{ fontWeight: 'bold' }}>{issue.id}: {issue.title} {issue.station ? `(${issue.station})` : ''}</div>
                              <div style={{ color: 'var(--success)', fontSize: '0.7rem' }}>Solución: {issue.solution}</div>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                    
                    <button className="btn btn-primary" type="submit">➕ Crear Ticket</button>
                  </form>
                </div>

                <div style={{ display: 'flex', flexDirection: 'column', gap: '8px', maxHeight: '40vh', overflowY: 'auto' }}>
                  {db.tickets.map(t => (
                    <div
                      key={t.id}
                      onClick={() => setActiveTicketId(t.id)}
                      className="card"
                      style={{ padding: '12px', cursor: 'pointer', backgroundColor: ticket && ticket.id === t.id ? 'var(--primary-glow)' : 'var(--card)' }}
                    >
                      <strong>{t.id} - {t.title}</strong>
                      <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.7rem', color: 'var(--text-muted)', marginTop: '4px' }}>
                        <span>{t.clientName}</span>
                        <span>{t.status}</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {ticket ? (
                <div className="card" style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <div>
                      <span className="badge badge-danger">{ticket.priority}</span>
                      <span className="badge badge-info" style={{ marginLeft: '8px' }}>{ticket.status}</span>
                      <h2 style={{ marginTop: '6px' }}>{ticket.title}</h2>
                      <p style={{ fontSize: '0.8125rem', color: 'var(--text-muted)' }}>
                        Cliente: <strong>{ticket.clientName}</strong> {ticket.station ? `| Estación: ${ticket.station}` : ''} | Asignado: <strong>{ticket.assigneeName}</strong>
                      </p>
                    </div>
                    {ticket.status !== 'Cerrado' && (
                      <button
                        className="btn btn-secondary"
                        style={{ borderColor: 'var(--success)', color: 'var(--success)', padding: '6px 10px', fontSize: '0.75rem', minWidth: 'auto' }}
                        onClick={() => {
                          const solutionText = prompt('Ingrese el reporte de diagnóstico y solución aplicada:', '');
                          if (solutionText === null) return; // cancelled
                          updateTicketStatus(ticket.id, 'Cerrado', solutionText);
                          setActiveTicketId(ticket.id);
                        }}
                      >
                        ✓ Finalizar Ticket
                      </button>
                    )}
                  </div>
                  <p style={{ fontSize: '0.875rem', backgroundColor: 'var(--background)', padding: '16px', borderRadius: 'var(--radius-sm)' }}>
                    {ticket.description}
                  </p>
                  
                  {ticket.solution && (
                    <div className="card" style={{ border: '1px solid var(--success)', backgroundColor: 'rgba(0, 230, 115, 0.05)', marginTop: '-8px', padding: '12px' }}>
                      <strong style={{ color: 'var(--success)', display: 'block', marginBottom: '4px', fontSize: '0.875rem' }}>✓ Solución Aplicada</strong>
                      <p style={{ fontSize: '0.8125rem', color: 'var(--text)', margin: 0 }}>{ticket.solution}</p>
                    </div>
                  )}

                  <div>
                    <h4>Historial de Incidencia</h4>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '8px', marginTop: '10px' }}>
                      {ticket.history.map((h, i) => (
                        <div key={i} style={{ padding: '10px', backgroundColor: 'var(--background)', borderRadius: 'var(--radius-xs)', fontSize: '0.8125rem' }}>
                          <div style={{ fontSize: '0.7rem', color: 'var(--text-muted)' }}>{h.user} - {h.date}</div>
                          <div>{h.action}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              ) : (
                <div className="card" style={{ textAlign: 'center', padding: '40px', color: 'var(--text-muted)' }}>
                  Seleccione o cree un ticket para ver sus detalles.
                </div>
              )}
            </div>
          </div>
        );
      }

      function KnowledgeBase() {
        const { db, currentUser, addWikiArticle, logActivity, setDb } = useContext(AppContext);
        const [activeArt, setActiveArt] = useState(null);
        const [showModal, setShowModal] = useState(false);
        const [isEditing, setIsEditing] = useState(false);
        const [editingId, setEditingId] = useState(null);

        // Form states
        const [title, setTitle] = useState('');
        const [category, setCategory] = useState('Infraestructura');
        const [tags, setTags] = useState('');
        const [errorCode, setErrorCode] = useState('');
        const [content, setContent] = useState('');

        // Search/Filter states
        const [searchQuery, setSearchQuery] = useState('');
        const [localSearch, setLocalSearch] = useState('');
        const [searchErrorCode, setSearchErrorCode] = useState('');
        const [localErrorCode, setLocalErrorCode] = useState('');
        const [selectedCategory, setSelectedCategory] = useState('Todos');

        if (!db) return null;
        
        const openAddModal = () => {
          setIsEditing(false);
          setTitle('');
          setCategory('Infraestructura');
          setTags('');
          setErrorCode('');
          setContent('');
          setShowModal(true);
        };

        const openEditModal = (a) => {
          setIsEditing(true);
          setEditingId(a.id);
          setTitle(a.title);
          setCategory(a.category);
          setTags(Array.isArray(a.tags) ? a.tags.join(', ') : (a.tags || ''));
          setErrorCode(a.errorCode || '');
          setContent(a.content);
          setShowModal(true);
        };

        const handleSubmit = (e) => {
          e.preventDefault();
          const artData = {
            title,
            category,
            tags,
            content,
            errorCode: errorCode.trim()
          };

          if (isEditing) {
            const updatedKb = db.knowledgeBase.map(item => {
              if (item.id !== editingId) return item;
              return {
                ...item,
                title,
                category,
                tags: typeof tags === 'string'
                  ? tags.split(',').map(t => t.trim()).filter(t => t.length > 0)
                  : (Array.isArray(tags) ? tags : []),
                content,
                errorCode: errorCode.trim(),
                lastUpdated: new Date().toISOString().substring(0, 10),
                author: currentUser ? currentUser.name : item.author
              };
            });
            const updatedDb = { ...db, knowledgeBase: updatedKb };
            setDb(updatedDb);
            localStorage.setItem(DB_KEY, JSON.stringify(updatedDb));
            logActivity('Wiki Conocimiento', `Artículo editado: "${title}"`);
            setActiveArt(updatedKb.find(item => item.id === editingId));
          } else {
            addWikiArticle(artData);
          }
          setShowModal(false);
        };

        const handleDelete = (id) => {
          if (confirm('¿Está seguro de que desea eliminar este artículo de la wiki?')) {
            const updatedKb = db.knowledgeBase.filter(item => item.id !== id);
            const updatedDb = { ...db, knowledgeBase: updatedKb };
            setDb(updatedDb);
            localStorage.setItem(DB_KEY, JSON.stringify(updatedDb));
            logActivity('Wiki Conocimiento', `Artículo de la Wiki eliminado ID ${id}`);
            setActiveArt(null);
          }
        };

        const categories = ['Todos', ...new Set([
          ...db.knowledgeBase.map(a => a.category).filter(Boolean),
          'Infraestructura',
          'Soporte Técnico',
          'Desarrollo de Software',
          'Administración',
          'Consultoría'
        ])];

        const filteredKb = db.knowledgeBase.filter(item => {
          const query = searchQuery.toLowerCase();
          const errQuery = searchErrorCode.toLowerCase();

          const matchesCategory = selectedCategory === 'Todos' || item.category === selectedCategory;
          const matchesErrorCode = !errQuery || (item.errorCode && item.errorCode.toLowerCase().includes(errQuery));

          const matchesSearch = !query || (
            item.title.toLowerCase().includes(query) ||
            item.category.toLowerCase().includes(query) ||
            (item.tags && Array.isArray(item.tags) && item.tags.some(tag => tag.toLowerCase().includes(query))) ||
            item.content.toLowerCase().includes(query)
          );

          return matchesCategory && matchesErrorCode && matchesSearch;
        });

        const art = activeArt || filteredKb[0];
        const isAdminOrGerente = currentUser && (currentUser.role === 'Administrador' || currentUser.role === 'Gerente');

        return (
          <div className="page-container">
            <div style={{ display: 'grid', gridTemplateColumns: '280px 1fr', gap: '20px' }}>
              <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                {isAdminOrGerente && (
                  <button className="btn btn-primary" style={{ width: '100%' }} onClick={openAddModal}>
                    ✍️ Nuevo Artículo
                  </button>
                )}
                <div className="card" style={{ padding: '12px', display: 'flex', flexDirection: 'column', gap: '8px' }}>
                  <div style={{ display: 'flex', gap: '6px', width: '100%', marginBottom: '4px' }}>
                    <input
                      type="text"
                      placeholder="Buscar procedimientos... (Enter)"
                      className="form-input"
                      value={localSearch}
                      onChange={(e) => {
                        setLocalSearch(e.target.value);
                        if (e.target.value === '') {
                          setSearchQuery('');
                        }
                      }}
                      onKeyDown={(e) => {
                        if (e.key === 'Enter') {
                          setSearchQuery(localSearch);
                        }
                      }}
                      style={{ fontSize: '0.8125rem', padding: '6px 10px', flex: 1 }}
                    />
                    <button 
                      className="btn btn-secondary" 
                      style={{ padding: '6px 10px', minWidth: 'auto', fontSize: '0.8125rem' }}
                      onClick={() => setSearchQuery(localSearch)}
                    >
                      🔍
                    </button>
                  </div>

                  <div style={{ display: 'flex', gap: '6px', width: '100%', marginBottom: '4px' }}>
                    <input
                      type="text"
                      placeholder="🔍 Código de Error... (Enter)"
                      className="form-input"
                      value={localErrorCode}
                      onChange={(e) => {
                        setLocalErrorCode(e.target.value);
                        if (e.target.value === '') {
                          setSearchErrorCode('');
                        }
                      }}
                      onKeyDown={(e) => {
                        if (e.key === 'Enter') {
                          setSearchErrorCode(localErrorCode);
                        }
                      }}
                      style={{ fontSize: '0.8125rem', padding: '6px 10px', flex: 1 }}
                    />
                    <button 
                      className="btn btn-secondary" 
                      style={{ padding: '6px 10px', minWidth: 'auto', fontSize: '0.8125rem' }}
                      onClick={() => setSearchErrorCode(localErrorCode)}
                    >
                      🔍
                    </button>
                  </div>
                  <div className="form-group" style={{ margin: 0 }}>
                    <label className="form-label" style={{ fontSize: '0.7rem', marginBottom: '2px' }}>Categoría / Caso</label>
                    <select
                      className="form-select"
                      value={selectedCategory}
                      onChange={e => setSelectedCategory(e.target.value)}
                      style={{ padding: '6px 10px', fontSize: '0.8125rem' }}
                    >
                      {categories.map(cat => (
                        <option key={cat} value={cat}>{cat}</option>
                      ))}
                    </select>
                  </div>
                </div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '8px', maxHeight: '55vh', overflowY: 'auto' }}>
                  {filteredKb.map(kb => (
                    <div
                      key={kb.id}
                      onClick={() => setActiveArt(kb)}
                      className="card"
                      style={{ padding: '14px', cursor: 'pointer', backgroundColor: art && art.id === kb.id ? 'var(--primary-glow)' : 'var(--card)', borderColor: art && art.id === kb.id ? 'var(--primary)' : 'var(--border)' }}
                    >
                      <strong>{kb.title}</strong>
                      <div style={{ fontSize: '0.7rem', color: 'var(--text-muted)', marginTop: '2px', display: 'flex', justifyContent: 'space-between' }}>
                        <span>{kb.category}</span>
                        {kb.errorCode && <span style={{ color: 'var(--warning)', fontWeight: 'bold' }}>{kb.errorCode}</span>}
                      </div>
                    </div>
                  ))}
                  {filteredKb.length === 0 && <p style={{ fontSize: '0.8125rem', color: 'var(--text-muted)' }}>No se encontraron artículos.</p>}
                </div>
              </div>

              {art ? (
                <div className="card" style={{ padding: '30px', position: 'relative' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                    <div>
                      <h2>{art.title}</h2>
                      <div style={{ display: 'flex', gap: '8px', margin: '8px 0', alignItems: 'center', flexWrap: 'wrap' }}>
                        <span className="badge badge-primary">{art.category}</span>
                        {art.errorCode && (
                          <span className="badge badge-danger" style={{ fontSize: '0.65rem', backgroundColor: 'rgba(230, 92, 0, 0.1)', color: 'var(--warning)', borderColor: 'var(--warning)', borderWidth: '1px', borderStyle: 'solid' }}>
                            ⚠️ Error: {art.errorCode}
                          </span>
                        )}
                        {art.tags && Array.isArray(art.tags) && art.tags.map((tag, i) => <span key={i} className="badge badge-secondary">#{tag}</span>)}
                      </div>
                    </div>
                    {isAdminOrGerente && (
                      <div style={{ display: 'flex', gap: '8px' }}>
                        <button className="btn btn-secondary" style={{ padding: '6px 12px', fontSize: '0.75rem' }} onClick={() => openEditModal(art)}>
                          ✏️ Editar
                        </button>
                        <button className="btn btn-secondary" style={{ padding: '6px 12px', fontSize: '0.75rem', color: 'var(--danger)' }} onClick={() => handleDelete(art.id)}>
                          🗑️ Eliminar
                        </button>
                      </div>
                    )}
                  </div>
                  <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)', marginBottom: '16px' }}>
                    Actualizado el {art.lastUpdated} por <strong>{art.author}</strong>
                  </div>
                  <hr style={{ borderColor: 'var(--border)', margin: '16px 0' }} />
                  <pre style={{ whiteSpace: 'pre-wrap', fontFamily: 'inherit', fontSize: '0.875rem', lineHeight: '1.6', color: 'var(--text-muted)' }}>
                    {art.content}
                  </pre>
                </div>
              ) : (
                <div className="card" style={{ textAlign: 'center', padding: '40px', color: 'var(--text-muted)' }}>
                  Seleccione un procedimiento para visualizar su contenido en la Wiki.
                </div>
              )}
            </div>

            {showModal && (
              <div className="modal-overlay">
                <div className="modal-content" style={{ maxWidth: '650px' }}>
                  <div className="modal-header">
                    <h3>{isEditing ? 'Editar Artículo' : 'Publicar Nuevo Artículo'}</h3>
                    <button className="btn btn-secondary" style={{ padding: '4px 8px' }} onClick={() => setShowModal(false)}>✕</button>
                  </div>
                  <form onSubmit={handleSubmit}>
                    <div className="modal-body">
                      <div className="form-group">
                        <label className="form-label">Título del Artículo / Procedimiento</label>
                        <input type="text" className="form-input" value={title} onChange={e => setTitle(e.target.value)} required placeholder="ej: Servidores MikroTik: Configuración de Túnel SSTP" />
                      </div>
                      <div className="form-group">
                        <label className="form-label">Código de Error (Opcional)</label>
                        <input type="text" className="form-input" value={errorCode} onChange={e => setErrorCode(e.target.value)} placeholder="ej: ERR-102, ORA-01033" />
                      </div>
                      <div className="grid-cols-2">
                        <div className="form-group">
                          <label className="form-label">Categoría</label>
                          <select className="form-select" value={category} onChange={e => setCategory(e.target.value)}>
                            <option value="Infraestructura">Infraestructura</option>
                            <option value="Soporte Técnico">Soporte Técnico</option>
                            <option value="Desarrollo de Software">Desarrollo de Software</option>
                            <option value="Administración">Administración</option>
                            <option value="Consultoría">Consultoría</option>
                          </select>
                        </div>
                        <div className="form-group">
                          <label className="form-label">Etiquetas (separadas por comas)</label>
                          <input type="text" className="form-input" value={tags} onChange={e => setTags(e.target.value)} placeholder="ej: VPN, Mikrotik, SSTP" />
                        </div>
                      </div>
                      <div className="form-group">
                        <label className="form-label">Contenido del Artículo</label>
                        <textarea className="form-textarea" rows="12" value={content} onChange={e => setContent(e.target.value)} required placeholder="Escriba aquí los pasos detallados o datos técnicos..." style={{ fontFamily: 'monospace', fontSize: '0.85rem' }}></textarea>
                      </div>
                    </div>
                    <div className="modal-footer">
                      <button type="button" className="btn btn-secondary" onClick={() => setShowModal(false)}>Cancelar</button>
                      <button type="submit" className="btn btn-primary">{isEditing ? 'Guardar Cambios' : 'Publicar Artículo'}</button>
                    </div>
                  </form>
                </div>
              </div>
            )}
          </div>
        );
      }

      // 8. REFERIDOS Y BONOS
      function Referrals() {
        const { db, currentUser, addReferral, approveReferralBonus, updateReferralBonus } = useContext(AppContext);
        const [showAddModal, setShowAddModal] = useState(false);
        const [clientName, setClientName] = useState('');
        const [bonusAmount, setBonusAmount] = useState('');
        const [details, setDetails] = useState('');

        if (!db || !currentUser) return null;

        const isMaster = currentUser.role === 'Administrador';
        const referralsList = db.referrals || [];

        const displayedReferrals = isMaster 
          ? referralsList 
          : referralsList.filter(ref => ref.employeeId === currentUser.id);

        const pendingCount = displayedReferrals.filter(r => r.status === 'Pendiente').length;
        const approvedCount = displayedReferrals.filter(r => r.status === 'Aprobado').length;
        const totalApprovedBonus = displayedReferrals
          .filter(r => r.status === 'Aprobado')
          .reduce((sum, r) => sum + (r.bonusAmount || 0), 0);

        const handleSubmit = (e) => {
          e.preventDefault();
          if (!clientName || !bonusAmount) return;

          addReferral({
            clientName,
            bonusAmount: parseFloat(bonusAmount) || 0,
            details
          });

          setClientName('');
          setBonusAmount('');
          setDetails('');
          setShowAddModal(false);
        };

        const handleApprove = (id) => {
          approveReferralBonus(id, 'Aprobado');
        };

        const handleReject = (id) => {
          if (window.confirm('¿Está seguro de que desea rechazar esta bonificación?')) {
            approveReferralBonus(id, 'Rechazado');
          }
        };

        return (
          <div className="page-container">
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <div>
                <h1>Referidos y Bonificaciones</h1>
                <p style={{ fontSize: '0.875rem', color: 'var(--text-muted)' }}>
                  Registre clientes referidos y gestione las bonificaciones de fin de mes.
                </p>
              </div>

              <div>
                {!isMaster && (
                  <button className="btn btn-primary" onClick={() => setShowAddModal(true)}>
                    + Registrar Referido
                  </button>
                )}
              </div>
            </div>

            <div className="metrics-grid">
              <div className="metric-card success">
                <span className="metric-title">Bono Acumulado Aprobado</span>
                <div className="metric-value">${totalApprovedBonus}</div>
                <span className="metric-trend" style={{ color: 'var(--success)' }}>
                  ✓ Bonos validados
                </span>
              </div>
              <div className="metric-card info">
                <span className="metric-title">Referidos Aprobados</span>
                <div className="metric-value">{approvedCount}</div>
                <span className="metric-trend" style={{ color: 'var(--info)' }}>
                  Clientes incorporados
                </span>
              </div>
              <div className="metric-card warning">
                <span className="metric-title">Pendientes de Aprobación</span>
                <div className="metric-value">{pendingCount}</div>
                <span className="metric-trend" style={{ color: 'var(--warning)' }}>
                  ⏰ Esperando revisión
                </span>
              </div>
            </div>

            <div className="card">
              <h3 style={{ fontSize: '1.05rem', marginBottom: '20px' }}>
                {isMaster ? 'Control de Referidos de Personal' : 'Mis Referidos Registrados'}
              </h3>

              {displayedReferrals.length === 0 ? (
                <div style={{ textAlign: 'center', padding: '40px', color: 'var(--text-muted)', fontSize: '0.875rem' }}>
                  No se han registrado clientes referidos en este período.
                </div>
              ) : (
                <div className="table-wrapper">
                  <table className="data-table">
                    <thead>
                      <tr>
                        <th>Fecha</th>
                        {isMaster && <th>Empleado</th>}
                        <th>Cliente Referido</th>
                        <th>Detalle / Contrato</th>
                        <th>Bono Propuesto</th>
                        <th>Estado</th>
                        {isMaster && <th>Acciones</th>}
                      </tr>
                    </thead>
                    <tbody>
                      {displayedReferrals.map(ref => (
                        <tr key={ref.id}>
                          <td style={{ fontSize: '0.8125rem', fontFamily: 'monospace' }}>{ref.date}</td>
                          {isMaster && <td style={{ fontWeight: 'bold' }}>{ref.employeeName}</td>}
                          <td style={{ fontWeight: 600 }}>{ref.clientName}</td>
                          <td style={{ fontSize: '0.8125rem', whiteSpace: 'normal', color: 'var(--text-muted)' }}>
                            {ref.details || 'Sin observaciones.'}
                          </td>
                          <td style={{ fontWeight: 'bold', color: 'var(--primary)' }}>
                            {isMaster && ref.status === 'Pendiente' ? (
                              <div style={{ display: 'flex', alignItems: 'center', gap: '4px' }}>
                                <span style={{ fontSize: '0.875rem' }}>$</span>
                                <input
                                  type="number"
                                  key={ref.id + '-' + ref.bonusAmount}
                                  defaultValue={ref.bonusAmount}
                                  onBlur={(e) => {
                                    const val = parseFloat(e.target.value) || 0;
                                    if (val !== ref.bonusAmount) {
                                      updateReferralBonus(ref.id, val);
                                    }
                                  }}
                                  onKeyDown={(e) => {
                                    if (e.key === 'Enter') {
                                      const val = parseFloat(e.target.value) || 0;
                                      if (val !== ref.bonusAmount) {
                                        updateReferralBonus(ref.id, val);
                                      }
                                      e.target.blur();
                                    }
                                  }}
                                  className="form-input"
                                  style={{
                                    width: '70px',
                                    padding: '2px 4px',
                                    fontSize: '0.8125rem',
                                    margin: 0,
                                    background: 'rgba(255,255,255,0.05)',
                                    border: '1px solid var(--border)',
                                    borderRadius: '4px',
                                    color: 'var(--primary)',
                                    fontWeight: 'bold'
                                  }}
                                />
                              </div>
                            ) : (
                              `$${ref.bonusAmount}`
                            )}
                          </td>
                          <td>
                            <span className={`badge ${
                              ref.status === 'Aprobado' ? 'badge-success' :
                              ref.status === 'Rechazado' ? 'badge-danger' : 'badge-warning'
                            }`}>
                              {ref.status}
                            </span>
                          </td>
                          {isMaster && (
                            <td>
                              {ref.status === 'Pendiente' ? (
                                <div style={{ display: 'flex', gap: '8px' }}>
                                  <button
                                    onClick={() => handleApprove(ref.id)}
                                    className="btn btn-primary"
                                    style={{ padding: '4px 8px', fontSize: '0.75rem', backgroundColor: 'var(--success)' }}
                                  >
                                    Aprobar
                                  </button>
                                  <button
                                    onClick={() => handleReject(ref.id)}
                                    className="btn btn-danger"
                                    style={{ padding: '4px 8px', fontSize: '0.75rem' }}
                                  >
                                    Rechazar
                                  </button>
                                </div>
                              ) : (
                                <span style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>
                                  {ref.approvedDate ? `Procesado el ${ref.approvedDate}` : 'Finalizado'}
                                </span>
                              )}
                            </td>
                          )}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>

            {showAddModal && (
              <div className="modal-overlay">
                <div className="modal-content" style={{ maxWidth: '480px' }}>
                  <div className="modal-header">
                    <h3>+ Registrar Cliente Referido</h3>
                    <button 
                      className="btn btn-secondary" 
                      onClick={() => setShowAddModal(false)}
                      style={{ padding: '4px 8px', minWidth: 'auto', border: 'none', background: 'none', fontSize: '1.2rem' }}
                    >✕</button>
                  </div>
                  
                  <form onSubmit={handleSubmit}>
                    <div className="modal-body" style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                      <div className="form-group">
                        <label className="form-label">Nombre del Cliente / Empresa</label>
                        <input 
                          type="text" 
                          className="form-input" 
                          placeholder="ej. Inversiones Chacao C.A." 
                          required 
                          value={clientName} 
                          onChange={e => setClientName(e.target.value)} 
                        />
                      </div>

                      <div className="form-group">
                        <label className="form-label">Monto de Bono Solicitado ($)</label>
                        <input 
                          type="number" 
                          className="form-input" 
                          placeholder="ej. 150" 
                          required 
                          min="1"
                          value={bonusAmount} 
                          onChange={e => setBonusAmount(e.target.value)} 
                        />
                      </div>

                      <div className="form-group">
                        <label className="form-label">Detalle del Negocio / Comentarios</label>
                        <textarea 
                          className="form-textarea" 
                          rows={3} 
                          placeholder="Describa el servicio contratado, condiciones, etc."
                          value={details} 
                          onChange={e => setDetails(e.target.value)} 
                          style={{ resize: 'vertical', minHeight: '70px' }}
                        />
                      </div>
                    </div>

                    <div className="modal-footer">
                      <button type="button" className="btn btn-secondary" onClick={() => setShowAddModal(false)}>Cancelar</button>
                      <button type="submit" className="btn btn-primary">Registrar Referido</button>
                    </div>
                  </form>
                </div>
              </div>
            )}
          </div>
        );
      }

      // 9. PLANOS Y DIAGRAMACIÓN 2D/3D
      function Layouts() {
        const { db, currentUser, updateClientLayout, updateClient, logActivity } = useContext(AppContext);
        const [selectedClientId, setSelectedClientId] = useState('');
        const [activeTab, setActiveTab] = useState('2d'); // '2d' or '3d'
        
        // Focused / selected item states
        const [focusedDevice, setFocusedDevice] = useState(null);
        const [selectedCell, setSelectedCell] = useState(null); // {x, y}
        const [showAddModal, setShowAddModal] = useState(false);
        
        // Form states
        const [devName, setDevName] = useState('');
        const [devType, setDevType] = useState('Servidor');
        const [devDesc, setDevDesc] = useState('');
        const [devInventory, setDevInventory] = useState('');
        const [devCablingPath, setDevCablingPath] = useState('');
        const [devCablingStatus, setDevCablingStatus] = useState('Directo');
        const [workstationUser, setWorkstationUser] = useState('');
        const [workstationPass, setWorkstationPass] = useState('');
        
        // Credentials revealing states
        const [revealedPass, setRevealedPass] = useState({}); // { devId: passwordText }
        const [loadingReveal, setLoadingReveal] = useState({}); // { devId: boolean }

        if (!db || !currentUser) return null;

        const activeClient = db.clients.find(c => c.id === selectedClientId) || db.clients[0];

        // General cabling notes for client
        const [cablingNotes, setCablingNotes] = useState('');

        // Edit Device States
        const [showEditModal, setShowEditModal] = useState(false);
        const [editDevId, setEditDevId] = useState('');
        const [editDevName, setEditDevName] = useState('');
        const [editDevType, setEditDevType] = useState('');
        const [editDevDesc, setEditDevDesc] = useState('');
        const [editDevInventory, setEditDevInventory] = useState('');
        const [editDevCablingPath, setEditDevCablingPath] = useState('');
        const [editDevCablingStatus, setEditDevCablingStatus] = useState('Directo');
        const [editWorkstationUser, setEditWorkstationUser] = useState('');
        const [editWorkstationPass, setEditWorkstationPass] = useState('');

        // Sync general cabling notes
        useEffect(() => {
          if (activeClient) {
            setCablingNotes(activeClient.cablingNotes || '');
          }
        }, [activeClient]);

        // Set default client if none selected
        if (db.clients.length > 0 && !selectedClientId) {
          setSelectedClientId(db.clients[0].id);
        }

        const layoutDevices = activeClient ? (activeClient.layout || []) : [];
        const coreDevice = layoutDevices.find(d => d.type === 'Rack') || 
                           layoutDevices.find(d => d.type === 'Switch') || 
                           layoutDevices.find(d => d.type === 'Servidor');

        const handleCellClick = (x, y) => {
          const existing = layoutDevices.find(d => d.x === x && d.y === y);
          if (existing) {
            setFocusedDevice(existing);
            setSelectedCell(null);
          } else {
            setSelectedCell({ x, y });
            setDevName('');
            setDevDesc('');
            setDevType('Servidor');
            setDevInventory('');
            setDevCablingPath('');
            setDevCablingStatus('Directo');
            setWorkstationUser('');
            setWorkstationPass('');
            setShowAddModal(true);
            setFocusedDevice(null);
          }
        };

        const handleAddSubmit = async (e) => {
          e.preventDefault();
          if (!selectedCell || !devName || !activeClient) return;

          let cipherPass = '';
          if (devType === 'Puesto de Trabajo' && workstationPass) {
            cipherPass = await encryptLocal(workstationPass);
          }

          const newDevice = {
            id: `dev-${Date.now()}`,
            x: selectedCell.x,
            y: selectedCell.y,
            type: devType,
            name: devName,
            description: devDesc,
            inventory: devInventory,
            cablingPath: devCablingPath,
            cablingStatus: devCablingStatus,
            username: devType === 'Puesto de Trabajo' ? workstationUser : undefined,
            password: devType === 'Puesto de Trabajo' ? cipherPass : undefined
          };

          const updatedLayout = [...layoutDevices, newDevice];
          const logDetails = `Agregó equipo "${devName}" (${devType}) en cuadrícula (${selectedCell.x}, ${selectedCell.y}) al plano del cliente "${activeClient.commercialName}"`;
          updateClientLayout(activeClient.id, updatedLayout, logDetails);

          setShowAddModal(false);
          setSelectedCell(null);
        };

        const handleEditClick = (dev) => {
          setEditDevId(dev.id);
          setEditDevName(dev.name);
          setEditDevType(dev.type);
          setEditDevDesc(dev.description || '');
          setEditDevInventory(dev.inventory || '');
          setEditDevCablingPath(dev.cablingPath || '');
          setEditDevCablingStatus(dev.cablingStatus || 'Directo');
          setEditWorkstationUser(dev.username || '');
          setEditWorkstationPass('');
          setShowEditModal(true);
        };

        const handleEditSubmit = async (e) => {
          e.preventDefault();
          if (!editDevId || !editDevName || !activeClient) return;

          const oldDev = layoutDevices.find(d => d.id === editDevId);
          if (!oldDev) return;

          let cipherPass = oldDev.password;
          if (editDevType === 'Puesto de Trabajo' && editWorkstationPass) {
            cipherPass = await encryptLocal(editWorkstationPass);
          } else if (editDevType !== 'Puesto de Trabajo') {
            cipherPass = undefined;
          }

          const updatedDevice = {
            ...oldDev,
            type: editDevType,
            name: editDevName,
            description: editDevDesc,
            inventory: editDevInventory,
            cablingPath: editDevCablingPath,
            cablingStatus: editDevCablingStatus,
            username: editDevType === 'Puesto de Trabajo' ? editWorkstationUser : undefined,
            password: cipherPass
          };

          const updatedLayout = layoutDevices.map(d => d.id === editDevId ? updatedDevice : d);
          const logDetails = `Modificó equipo "${editDevName}" (${editDevType}) en el plano del cliente "${activeClient.commercialName}"`;
          updateClientLayout(activeClient.id, updatedLayout, logDetails);

          setFocusedDevice(updatedDevice);
          setShowEditModal(false);
        };

        const handleDeleteDevice = (id, name) => {
          if (!activeClient) return;
          if (window.confirm(`¿Está seguro de que desea eliminar el equipo "${name}" del plano?`)) {
            const updatedLayout = layoutDevices.filter(d => d.id !== id);
            const logDetails = `Eliminó equipo "${name}" del plano del cliente "${activeClient.commercialName}"`;
            updateClientLayout(activeClient.id, updatedLayout, logDetails);
            setFocusedDevice(null);
          }
        };

        const handleRevealPassword = async (dev) => {
          if (revealedPass[dev.id]) {
            const updated = { ...revealedPass };
            delete updated[dev.id];
            setRevealedPass(updated);
            return;
          }

          setLoadingReveal(prev => ({ ...prev, [dev.id]: true }));
          const plainText = await decryptLocal(dev.password);
          setRevealedPass(prev => ({ ...prev, [dev.id]: plainText }));
          setLoadingReveal(prev => ({ ...prev, [dev.id]: false }));

          logActivity('Bóveda de Planos', `Consultó clave del puesto de trabajo "${dev.name}" (usuario: ${dev.username}) para el cliente "${activeClient.commercialName}"`);
        };

        const deviceMeta = {
          'Rack': { icon: '🏢', color: 'hsl(280, 80%, 60%)', colorLight: 'hsla(280, 80%, 60%, 0.15)' },
          'Servidor': { icon: '🖥️', color: 'hsl(200, 89%, 48%)', colorLight: 'hsla(200, 89%, 48%, 0.15)' },
          'Router': { icon: '🌐', color: 'hsl(199, 89%, 48%)', colorLight: 'hsla(199, 89%, 48%, 0.15)' },
          'Switch': { icon: '🔌', color: 'hsl(38, 92%, 50%)', colorLight: 'hsla(38, 92%, 50%, 0.15)' },
          'Firewall': { icon: '🧱', color: 'hsl(0, 84%, 60%)', colorLight: 'hsla(0, 84%, 60%, 0.15)' },
          'UPS': { icon: '🔋', color: 'hsl(38, 92%, 50%)', colorLight: 'hsla(38, 92%, 50%, 0.15)' },
          'Antena / AP': { icon: '📡', color: 'hsl(250, 84%, 64%)', colorLight: 'hsla(250, 84%, 64%, 0.15)' },
          'Impresora': { icon: '🖨️', color: 'hsl(240, 5%, 65%)', colorLight: 'hsla(240, 5%, 65%, 0.15)' },
          'Puesto de Trabajo': { icon: '💼', color: 'hsl(142, 70%, 45%)', colorLight: 'hsla(142, 70%, 45%, 0.15)' },
          'Mesa': { icon: '🟫', color: 'hsl(25, 50%, 40%)', colorLight: 'hsla(25, 50%, 40%, 0.15)' },
          'Silla': { icon: '🪑', color: 'hsl(30, 45%, 45%)', colorLight: 'hsla(30, 45%, 45%, 0.15)' },
          'Mobiliario': { icon: '🗄️', color: 'hsl(200, 15%, 40%)', colorLight: 'hsla(200, 15%, 40%, 0.15)' },
          'Planta Decorativa': { icon: '🌱', color: 'hsl(120, 60%, 40%)', colorLight: 'hsla(120, 60%, 40%, 0.15)' }
        };

        const getDeviceMeta = (type) => deviceMeta[type] || { icon: '⚙️', color: 'var(--primary)', colorLight: 'var(--primary-glow)' };

        const gridCoords = [];
        for (let y = 1; y <= 8; y++) {
          for (let x = 1; x <= 8; x++) {
            gridCoords.push({ x, y });
          }
        }

        return (
          <div className="page-container">
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '16px', flexWrap: 'wrap' }}>
              <div>
                <h1 style={{ fontSize: '1.5rem', fontWeight: 800, letterSpacing: '-0.02em' }}>Planos e Instalaciones de Clientes</h1>
                <p style={{ fontSize: '0.875rem', color: 'var(--text-muted)' }}>
                  Diagramador de infraestructura de red física y puestos de trabajo en 2D y 3D.
                </p>
              </div>

              <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                <span className="form-label" style={{ fontSize: '0.75rem', whiteSpace: 'nowrap' }}>Cliente:</span>
                <select
                  className="form-select"
                  style={{ width: '220px', padding: '8px 12px' }}
                  value={selectedClientId}
                  onChange={(e) => {
                    setSelectedClientId(e.target.value);
                    setFocusedDevice(null);
                  }}
                >
                  {db.clients.map(c => (
                    <option key={c.id} value={c.id}>{c.commercialName}</option>
                  ))}
                </select>
              </div>
            </div>

            {!activeClient ? (
              <div className="card" style={{ textAlign: 'center', padding: '60px', color: 'var(--text-muted)' }}>
                ⚠️ Debe registrar al menos un cliente en el sistema para poder usar la diagramación.
              </div>
            ) : (
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 300px', gap: '24px', alignItems: 'start' }}>
                
                <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                  
                  <div style={{ display: 'flex', gap: '8px', borderBottom: '1px solid var(--border)', paddingBottom: '12px' }}>
                    <button
                      className={`btn ${activeTab === '2d' ? 'btn-primary' : 'btn-secondary'}`}
                      onClick={() => setActiveTab('2d')}
                      style={{ padding: '8px 16px', fontSize: '0.8125rem' }}
                    >
                      🗺️ Vista Editor 2D
                    </button>
                    <button
                      className={`btn ${activeTab === '3d' ? 'btn-primary' : 'btn-secondary'}`}
                      onClick={() => setActiveTab('3d')}
                      style={{ padding: '8px 16px', fontSize: '0.8125rem' }}
                    >
                      📦 Vista Isométrica 3D
                    </button>
                  </div>

                  {activeTab === '2d' && (
                    <div className="card" style={{ padding: '24px', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '16px' }}>
                      <p style={{ fontSize: '0.75rem', color: 'var(--text-muted)', width: '100%', textAlign: 'center' }}>
                        Pulse sobre una celda vacía para colocar un equipo nuevo, o sobre un equipo para editarlo.
                      </p>

                      <div style={{ display: 'flex', gap: '10px', width: '100%', maxWidth: '520px' }}>
                        <div style={{ display: 'flex', flexDirection: 'column', justifyContent: 'space-between', padding: '24px 0 10px 0', width: '20px', fontSize: '0.75rem', fontWeight: 'bold', color: 'var(--text-muted)', textAlign: 'right' }}>
                          {[1,2,3,4,5,6,7,8].map(y => <div key={y} style={{ height: '48px', display: 'flex', alignItems: 'center', justifyContent: 'flex-end' }}>{y}</div>)}
                        </div>

                        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: '10px' }}>
                          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(8, 1fr)', gap: '6px', textAlign: 'center', fontSize: '0.75rem', fontWeight: 'bold', color: 'var(--text-muted)' }}>
                            {['A','B','C','D','E','F','G','H'].map(x => <div key={x}>{x}</div>)}
                          </div>

                          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(8, 1fr)', gap: '6px', position: 'relative' }}>
                            {/* SVG Cable lines */}
                            {coreDevice && (
                              <svg style={{ position: 'absolute', top: 0, left: 0, width: '100%', height: '100%', pointerEvents: 'none', zIndex: 5 }}>
                                {layoutDevices.map(dev => {
                                  if (dev.id === coreDevice.id) return null;
                                  const isFurniture = ['Mesa', 'Silla', 'Mobiliario', 'Planta Decorativa'].includes(dev.type);
                                  if (isFurniture) return null;
                                  const cx1 = `${((dev.x - 0.5) / 8) * 100}%`;
                                  const cy1 = `${((dev.y - 0.5) / 8) * 100}%`;
                                  const cx2 = `${((coreDevice.x - 0.5) / 8) * 100}%`;
                                  const cy2 = `${((coreDevice.y - 0.5) / 8) * 100}%`;
                                  
                                  let strokeColor = 'var(--primary)';
                                  let dash = 'none';
                                  if (dev.cablingStatus === 'Puenteado') {
                                    strokeColor = 'var(--warning)';
                                  } else if (dev.cablingStatus === 'Inactivo') {
                                    strokeColor = 'var(--danger)';
                                    dash = '4 4';
                                  } else if (dev.cablingStatus === 'Requiere Mantenimiento') {
                                    strokeColor = 'var(--warning)';
                                    dash = '2 2';
                                  } else {
                                    strokeColor = 'var(--success)';
                                  }
                                  
                                  return (
                                    <line 
                                      key={`cable-${dev.id}`}
                                      x1={cx1} 
                                      y1={cy1} 
                                      x2={cx2} 
                                      y2={cy2} 
                                      stroke={strokeColor} 
                                      strokeWidth="2" 
                                      strokeOpacity="0.6"
                                      strokeDasharray={dash}
                                    />
                                  );
                                })}
                              </svg>
                            )}

                            {gridCoords.map(cell => {
                              const dev = layoutDevices.find(d => d.x === cell.x && d.y === cell.y);
                              const isFocused = focusedDevice && focusedDevice.id === dev?.id;
                              const meta = dev ? getDeviceMeta(dev.type) : null;

                              return (
                                <div
                                  key={`${cell.x}-${cell.y}`}
                                  onClick={() => handleCellClick(cell.x, cell.y)}
                                  style={{
                                    aspectRatio: '1',
                                    border: dev ? `1px solid ${meta?.color}` : '1px dashed var(--border)',
                                    borderRadius: 'var(--radius-sm)',
                                    backgroundColor: isFocused ? 'var(--primary-glow)' : dev ? meta?.colorLight : 'transparent',
                                    display: 'flex',
                                    flexDirection: 'column',
                                    alignItems: 'center',
                                    justifyContent: 'center',
                                    cursor: 'pointer',
                                    position: 'relative',
                                    transition: 'all var(--transition-fast)',
                                  }}
                                  title={dev ? `${dev.name} (${dev.type})` : `Celda ${['A','B','C','D','E','F','G','H'][cell.x-1]}${cell.y}`}
                                >
                                  {dev ? (
                                    <>
                                      <span style={{ fontSize: '1.5rem' }}>{meta?.icon}</span>
                                      {/* Cabling Status Indicator Dot */}
                                      {!['Mesa', 'Silla', 'Mobiliario', 'Planta Decorativa'].includes(dev.type) && (
                                        <div style={{
                                          position: 'absolute',
                                          top: '4px',
                                          right: '4px',
                                          width: '8px',
                                          height: '8px',
                                          borderRadius: '50%',
                                          backgroundColor: dev.cablingStatus === 'Puenteado' ? 'var(--warning)' :
                                                           dev.cablingStatus === 'Inactivo' ? 'var(--danger)' :
                                                           dev.cablingStatus === 'Requiere Mantenimiento' ? 'var(--warning)' : 'var(--success)',
                                          border: '1px solid var(--card)',
                                          boxShadow: '0 0 4px rgba(0,0,0,0.5)'
                                        }} title={`Cableado: ${dev.cablingStatus || 'Directo'}`} />
                                      )}
                                    </>
                                  ) : (
                                    <span style={{ fontSize: '0.65rem', color: 'var(--text-muted)' }}>

            phone,

                    if ((b.productivity ? b.productivity.performance : 100) !== (a.productivity ? a.productivity.performance : 100)) {
                      return (b.productivity ? b.productivity.performance : 100) - (a.productivity ? a.productivity.performance : 100);
                    }
                    return (b.productivity ? b.productivity.completed : 0) - (a.productivity ? a.productivity.completed : 0);
                  })

                    const performance = emp.productivity ? emp.productivity.performance : 100;
                    const completed = emp.productivity ? emp.productivity.completed : 0;
                    const rank = index + 1;
                    const rankIcon = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : `#${rank}`;
                    
                    // Determine status indicator color and text
                    let barColor = 'var(--danger)'; // Red
                    let statusText = 'En Revisión';
                    if (performance >= 90) {
                      barColor = 'var(--success)'; // Green
                      statusText = 'Sobresaliente';
                    } else if (performance >= 70) {
                      barColor = 'var(--warning)'; // Yellow/Orange
                      statusText = 'Óptimo';

                          display: 'flex', 
                          alignItems: 'center',

                          border: '1px solid var(--border)', 
                          borderRadius: 'var(--radius-sm)',

                            <strong style={{ color: barColor }}>{performance}% ({statusText})</strong>

                            <strong style={{ color: 'var(--success)' }}>{completed}</strong>
