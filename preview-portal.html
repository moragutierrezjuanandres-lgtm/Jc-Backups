<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>JC Portal</title>
    <!-- Modern Typography: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- React & Babel CDNs for instant browser execution -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      /* --- VARIABLES & DESIGN TOKENS --- */
      :root {
        --font-sans: 'Outfit', 'Inter', system-ui, -apple-system, sans-serif;
        --background-h: 240; --background-s: 10%; --background-l: 4%;
        --background: hsl(var(--background-h), var(--background-s), var(--background-l));
        --card-h: 240; --card-s: 10%; --card-l: 7%;
        --card: hsl(var(--card-h), var(--card-s), var(--card-l));
        --card-hover: hsl(var(--card-h), var(--card-s), 10%);
        --border-h: 240; --border-s: 6%; --border-l: 14%;
        --border: hsl(var(--border-h), var(--border-s), var(--border-l));
        --text-h: 240; --text-s: 5%; --text-l: 95%;
        --text: hsl(var(--text-h), var(--text-s), var(--text-l));
        --text-muted-h: 240; --text-muted-s: 5%; --text-muted-l: 65%;
        --text-muted: hsl(var(--text-muted-h), var(--text-muted-s), var(--text-muted-l));
        
        --primary-h: 250; --primary-s: 84%; --primary-l: 64%;
        --primary: hsl(var(--primary-h), var(--primary-s), var(--primary-l));
        --primary-hover: hsl(var(--primary-h), var(--primary-s), 58%);
        --primary-glow: hsla(var(--primary-h), var(--primary-s), var(--primary-l), 0.15);
        --secondary-h: 280; --secondary-s: 80%; --secondary-l: 60%;
        --secondary: hsl(var(--secondary-h), var(--secondary-s), var(--secondary-l));
        
        --success-h: 142; --success-s: 70%; --success-l: 45%;
        --success: hsl(var(--success-h), var(--success-s), var(--success-l));
        --warning-h: 38; --warning-s: 92%; --warning-l: 50%;
        --warning: hsl(var(--warning-h), var(--warning-s), var(--warning-l));
        --danger-h: 0; --danger-s: 84%; --danger-l: 60%;
        --danger: hsl(var(--danger-h), var(--danger-s), var(--danger-l));
        --info-h: 199; --info-s: 89%; --info-l: 48%;
        --info: hsl(var(--info-h), var(--info-s), var(--info-l));

        --radius-xs: 4px; --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-full: 9999px;
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.4);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -2px rgba(0, 0, 0, 0.4);
        --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -4px rgba(0, 0, 0, 0.5);
        --shadow-glow: 0 0 20px 0 hsla(var(--primary-h), var(--primary-s), var(--primary-l), 0.25);
        --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        --transition-normal: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        --sidebar-width: 260px; --mobile-nav-height: 64px;
      }

      [data-theme='light'] {
        --background-h: 240; --background-s: 15%; --background-l: 97%;
        --background: hsl(var(--background-h), var(--background-s), var(--background-l));
        --card-h: 0; --card-s: 0%; --card-l: 100%;
        --card: hsl(var(--card-h), var(--card-s), var(--card-l));
        --card-hover: hsl(var(--card-h), var(--card-s), 97%);
        --border-h: 240; --border-s: 8%; --border-l: 89%;
        --border: hsl(var(--border-h), var(--border-s), var(--border-l));
        --text-h: 240; --text-s: 10%; --text-l: 10%;
        --text: hsl(var(--text-h), var(--text-s), var(--text-l));
        --text-muted-h: 240; --text-muted-s: 6%; --text-muted-l: 45%;
        --text-muted: hsl(var(--text-muted-h), var(--text-muted-s), var(--text-muted-l));
        --primary-h: 250; --primary-s: 84%; --primary-l: 58%;
        --primary: hsl(var(--primary-h), var(--primary-s), var(--primary-l));
        --primary-hover: hsl(var(--primary-h), var(--primary-s), 50%);
        --primary-glow: hsla(var(--primary-h), var(--primary-s), var(--primary-l), 0.08);
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.08);
        --shadow-glow: 0 0 20px 0 hsla(var(--primary-h), var(--primary-s), var(--primary-l), 0.1);
      }

      /* --- PRINT STYLES FOR PDF REPORTS --- */
      @media print {
        body {
          background: #fff !important;
          color: #000 !important;
          font-size: 11pt !important;
          font-family: Arial, sans-serif !important;
          margin: 0 !important;
          padding: 0 !important;
        }
        #app-root, .app-container, header, nav, aside, .page-container, .modal-overlay, .btn, button, select, input, textarea {
          display: none !important;
        }
        .print-report-container {
          display: block !important;
          visibility: visible !important;
          background: #fff !important;
          color: #000 !important;
          width: 100% !important;
          max-width: 100% !important;
          margin: 0 !important;
          padding: 20px !important;
        }
        .print-report-header {
          border-bottom: 2px solid #333 !important;
          padding-bottom: 12px !important;
          margin-bottom: 24px !important;
          display: flex !important;
          justify-content: space-between !important;
          align-items: center !important;
        }
        .print-report-title {
          font-size: 20pt !important;
          font-weight: bold !important;
          color: #111 !important;
          margin: 0 !important;
        }
        .print-report-meta {
          font-size: 10pt !important;
          color: #555 !important;
          text-align: right !important;
        }
        .print-section {
          margin-bottom: 24px !important;
          page-break-inside: avoid !important;
        }
        .print-section-title {
          font-size: 13pt !important;
          font-weight: bold !important;
          color: #222 !important;
          border-bottom: 1px solid #ddd !important;
          padding-bottom: 6px !important;
          margin-bottom: 12px !important;
          text-transform: uppercase !important;
        }
        .print-grid {
          display: grid !important;
          grid-template-columns: repeat(2, 1fr) !important;
          gap: 12px !important;
          margin-bottom: 12px !important;
        }
        .print-field {
          font-size: 10pt !important;
          margin-bottom: 6px !important;
        }
        .print-field strong {
          color: #333 !important;
        }
        .print-table {
          width: 100% !important;
          border-collapse: collapse !important;
          margin-top: 8px !important;
          font-size: 9.5pt !important;
        }
        .print-table th, .print-table td {
          border: 1px solid #ddd !important;
          padding: 6px 8px !important;
          text-align: left !important;
        }
        .print-table th {
          background-color: #f4f4f4 !important;
          font-weight: bold !important;
          color: #000 !important;
        }
        .badge {
          border: 1px solid #333 !important;
          padding: 2px 4px !important;
          font-size: 8pt !important;
          border-radius: 3px !important;
          background: transparent !important;
          color: #000 !important;
        }
      }
      @media screen {
        .print-report-container {
          display: none !important;
        }
      }

      /* --- RESET & LAYOUT --- */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        background-color: var(--background); color: var(--text);
        font-family: var(--font-sans); font-size: 16px; line-height: 1.5;
        width: 100%; height: 100%; overflow: hidden;
        transition: background-color var(--transition-normal), color var(--transition-normal);
        -webkit-font-smoothing: antialiased;
      }
      #root { width: 100%; height: 100%; display: flex; flex-direction: column; }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: var(--background); }
      ::-webkit-scrollbar-thumb { background: var(--border); border-radius: var(--radius-full); }
      ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

      h1, h2, h3, h4 { font-weight: 700; line-height: 1.25; color: var(--text); letter-spacing: -0.025em; }
      a { color: var(--primary); text-decoration: none; transition: color var(--transition-fast); }

      .app-container { display: flex; width: 100%; height: 100vh; overflow: hidden; }
      .sidebar {
        width: var(--sidebar-width); height: 100%; background-color: var(--card);
        border-right: 1px solid var(--border); display: flex; flex-direction: column;
        flex-shrink: 0; transition: transform var(--transition-normal); z-index: 100;
      }
      .sidebar-logo { padding: 24px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); }
      .sidebar-logo-icon {
        width: 32px; height: 32px; border-radius: var(--radius-sm);
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 1.25rem;
      }
      .sidebar-logo-text { font-weight: 750; font-size: 1.15rem; letter-spacing: -0.03em; }
      .sidebar-menu { flex: 1; padding: 20px 12px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
      .sidebar-item {
        display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: var(--radius-sm);
        color: var(--text-muted); font-size: 0.875rem; font-weight: 500; cursor: pointer; transition: all var(--transition-fast);
        background: none; border: none; text-align: left; width: 100%;
      }
      .sidebar-item:hover, .sidebar-item.active { color: var(--text); background-color: var(--background); }
      .sidebar-item.active { border-left: 3px solid var(--primary); background-color: var(--primary-glow); color: var(--primary); }
      .sidebar-footer { padding: 16px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; }

      .main-content { flex: 1; display: flex; flex-direction: column; height: 100%; overflow-y: auto; position: relative; }
      .header-bar {
        height: 64px; width: 100%; border-bottom: 1px solid var(--border); background-color: var(--card);
        padding: 0 24px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; z-index: 50;
      }
      .header-actions { display: flex; align-items: center; gap: 16px; }
      .role-selector-wrap { display: flex; align-items: center; gap: 8px; }

      .page-container { padding: 24px; width: 100%; max-width: 1300px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; animation: fadeInPage var(--transition-normal) forwards; }
      .card { background-color: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 20px; box-shadow: var(--shadow-sm); }
      .card:hover { border-color: hsla(var(--primary-h), var(--primary-s), var(--primary-l), 0.3); }

      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px;
        border-radius: var(--radius-sm); font-family: var(--font-sans); font-weight: 550; font-size: 0.875rem;
        cursor: pointer; transition: all var(--transition-fast); border: 1px solid transparent;
      }
      .btn-primary { background-color: var(--primary); color: #ffffff; }
      .btn-primary:hover { background-color: var(--primary-hover); box-shadow: var(--shadow-glow); }
      .btn-secondary { background-color: var(--background); border-color: var(--border); color: var(--text); }
      .btn-secondary:hover { background-color: var(--card-hover); border-color: var(--text-muted); }
      .btn-danger { background-color: var(--danger); color: #ffffff; }
      .btn-danger:hover { filter: brightness(1.1); }

      .form-group { display: flex; flex-direction: column; gap: 6px; width: 100%; }
      .form-label { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
      .form-input, .form-select, .form-textarea {
        width: 100%; padding: 10px 14px; background-color: var(--background); border: 1px solid var(--border);
        border-radius: var(--radius-sm); color: var(--text); font-family: var(--font-sans); font-size: 0.875rem;
      }
      .form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-glow); }

      .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: var(--radius-full); font-size: 0.7rem; font-weight: 600; text-transform: capitalize; }
      .badge-primary { background: hsla(var(--primary-h), var(--primary-s), var(--primary-l), 0.15); color: var(--primary); }
      .badge-success { background: hsla(var(--success-h), var(--success-s), var(--success-l), 0.15); color: var(--success); }
      .badge-warning { background: hsla(var(--warning-h), var(--warning-s), var(--warning-l), 0.15); color: var(--warning); }
      .badge-danger { background: hsla(var(--danger-h), var(--danger-s), var(--danger-l), 0.15); color: var(--danger); }
      .badge-info { background: hsla(var(--info-h), var(--info-s), var(--info-l), 0.15); color: var(--info); }
      .badge-secondary { background: hsla(var(--secondary-h), var(--secondary-s), var(--secondary-l), 0.15); color: var(--secondary); }

      .table-wrapper { width: 100%; overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-md); background-color: var(--card); }
      .data-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.875rem; }
      .data-table th { padding: 12px 16px; background-color: hsla(0, 0%, 0%, 0.12); border-bottom: 1px solid var(--border); font-weight: 600; color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; }
      .data-table td { padding: 14px 16px; border-bottom: 1px solid var(--border); color: var(--text); white-space: nowrap; }
      .data-table tr:last-child td { border-bottom: none; }
      .data-table tr:hover td { background-color: hsla(var(--primary-h), var(--primary-s), var(--primary-l), 0.03); }

      /* --- DASHBOARD ITEMS --- */
      .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; width: 100%; }
      .metric-card { display: flex; flex-direction: column; justify-content: space-between; padding: 20px; border-radius: var(--radius-md); background: var(--card); border: 1px solid var(--border); position: relative; overflow: hidden; }
      .metric-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--primary); }
      .metric-card.success::before { background: var(--success); }
      .metric-card.warning::before { background: var(--warning); }
      .metric-card.danger::before { background: var(--danger); }
      .metric-card.info::before { background: var(--info); }
      .metric-title { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
      .metric-value { font-size: 1.875rem; font-weight: 800; color: var(--text); margin-top: 8px; letter-spacing: -0.03em; }
      .metric-trend { font-size: 0.75rem; font-weight: 600; margin-top: 6px; display: inline-flex; align-items: center; gap: 4px; }
      
      .dashboard-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
      .activity-feed { display: flex; flex-direction: column; gap: 16px; }
      .activity-item { display: flex; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
      .activity-item:last-child { border-bottom: none; padding-bottom: 0; }
      .activity-icon { width: 32px; height: 32px; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; flex-shrink: 0; background-color: var(--background); border: 1px solid var(--border); font-size: 0.9rem; }
      .activity-content { flex: 1; }
      .activity-text { font-size: 0.8125rem; color: var(--text); }
      .activity-time { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; }

      .agenda-list { display: flex; flex-direction: column; gap: 10px; }
      .agenda-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background-color: var(--background); border: 1px solid var(--border); border-radius: var(--radius-sm); }
      .agenda-info { display: flex; align-items: center; gap: 12px; }
      .agenda-checkbox { width: 18px; height: 18px; border-radius: var(--radius-xs); border: 2px solid var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; }
      .agenda-checkbox.checked { background-color: var(--success); border-color: var(--success); }
      .agenda-title { font-size: 0.875rem; font-weight: 550; }
      .agenda-title.done { text-decoration: line-through; color: var(--text-muted); }
      .agenda-meta { font-size: 0.75rem; color: var(--text-muted); display: flex; gap: 8px; margin-top: 2px; }

      .productivity-indicator { display: flex; align-items: center; gap: 16px; margin-top: 14px; }
      .productivity-circle-container { width: 64px; height: 64px; position: relative; display: flex; align-items: center; justify-content: center; }
      .productivity-value-text { position: absolute; font-size: 0.95rem; font-weight: 700; color: var(--text); }

      /* --- KANBAN & CRM --- */
      .kanban-container { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 12px; width: 100%; }
      .kanban-column { width: 280px; background-color: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); flex-shrink: 0; display: flex; flex-direction: column; max-height: 65vh; }
      .kanban-header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background-color: hsla(0, 0%, 0%, 0.12); }
      .kanban-title { font-size: 0.8125rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
      .kanban-count { font-size: 0.7rem; padding: 2px 6px; background-color: var(--background); border-radius: var(--radius-sm); color: var(--text-muted); }
      .kanban-cards-wrapper { flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
      .kanban-card { background-color: var(--background); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; cursor: pointer; transition: all var(--transition-fast); display: flex; flex-direction: column; gap: 8px; }
      .kanban-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
      .kanban-card-title { font-size: 0.8125rem; font-weight: 600; color: var(--text); }
      .kanban-card-meta { display: flex; align-items: center; justify-content: space-between; font-size: 0.7rem; color: var(--text-muted); }

      .crm-pipeline { display: flex; gap: 4px; width: 100%; overflow-x: auto; padding-bottom: 8px; }
      .crm-stage { flex: 1; min-width: 90px; padding: 8px; text-align: center; background-color: var(--background); border: 1px solid var(--border); border-radius: var(--radius-xs); font-size: 0.7rem; font-weight: 600; color: var(--text-muted); cursor: pointer; }
      .crm-stage.active { background-color: var(--primary-glow); border-color: var(--primary); color: var(--primary); }

      .vault-secret-container { display: flex; align-items: center; gap: 8px; background-color: var(--background); border: 1px solid var(--border); padding: 6px 12px; border-radius: var(--radius-sm); font-family: monospace; }
      .vault-secret-text { flex: 1; font-size: 0.8125rem; overflow: hidden; text-overflow: ellipsis; }

      .notifications-bell { position: relative; cursor: pointer; padding: 8px; border-radius: var(--radius-full); }
      .notifications-bell:hover { background-color: var(--background); }
      .bell-badge { position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; background-color: var(--danger); border-radius: var(--radius-full); }

      /* --- MODALS --- */
      .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
      .modal-content { background-color: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); animation: fadeIn var(--transition-normal) forwards; }
      .modal-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
      .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
      .modal-footer { padding: 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 12px; }

      .grid-cols-1 { display: grid; grid-template-columns: 1fr; gap: 20px; }
      .grid-cols-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }

      /* --- MOBILE STYLING --- */
      .mobile-nav { display: none; position: fixed; bottom: 0; left: 0; width: 100%; height: var(--mobile-nav-height); background-color: var(--card); border-top: 1px solid var(--border); z-index: 200; grid-template-columns: repeat(5, 1fr); align-items: center; }
      .mobile-nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); font-size: 0.65rem; font-weight: 500; gap: 2px; height: 100%; cursor: pointer; }
      .mobile-nav-item.active { color: var(--primary); }

      @media (max-width: 768px) {
        .sidebar { display: none; }
        .mobile-nav { display: grid; }
        .main-content { margin-bottom: var(--mobile-nav-height); height: calc(100vh - var(--mobile-nav-height)); }
        .page-container { padding: 16px; gap: 16px; }
        .grid-cols-2 { grid-template-columns: 1fr; }
        .dashboard-grid { grid-template-columns: 1fr; }
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeInPage {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      /* --- SPLASH SCREEN ANIMATIONS --- */
      .splash-dots {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 24px;
      }
      .splash-dot {
        width: 14px;
        height: 14px;
        background-color: var(--primary);

  <body>
    <div id="root"></div>

    <!-- REACT WEB APP INTERFACE ENGINE -->
    <script type="text/babel">
      const { useState, useEffect, createContext, useContext, useRef } = React;

      // ==========================================
      // CRYPTO & DATABASE SERVICES (Local storage)
      // ==========================================
      
      // Local XOR Fallback to support file:// direct double-clicks safely
      async function encryptLocal(text) {
        if (!text) return '';
        const xored = text.split('').map((char, i) => String.fromCharCode(char.charCodeAt(0) ^ 42)).join('');
        return JSON.stringify({ mode: 'fallback', data: btoa(unescape(encodeURIComponent(xored))) });
      }

      async function decryptLocal(encryptedJsonString) {
        if (!encryptedJsonString) return '';
        try {
          const payload = JSON.parse(encryptedJsonString);
          const raw = decodeURIComponent(escape(atob(payload.data)));
          return raw.split('').map((char, i) => String.fromCharCode(char.charCodeAt(0) ^ 42)).join('');
        } catch(e) {
          return 'Error de descifrado';
        }
      }

      const DB_KEY = 'jc_enterprise_db_data';
      const DB_VERSION = 2; // Increment to force a clean reset

      const INITIAL_EMPLOYEES = [
        { id: 'master', name: 'Master JC', email: 'master@jc.com', username: 'master', password: '7251793', role: 'Administrador', department: 'Administración General', phone: '+58 412 111 2233', status: 'Activo', productivity: { completed: 0, active: 0, performance: 100 } }
      ];

      const INITIAL_CLIENTS_RAW = [];
      const INITIAL_PROJECTS = [];
      const INITIAL_AGENDA = [];
      const INITIAL_WEEKLY_GOALS = [];
      const INITIAL_TICKETS = [];
      const INITIAL_KNOWLEDGE_BASE = [];
      const INITIAL_CRM = [];
      const INITIAL_AUDIT = [];

      async function bootDatabase() {
        const existing = localStorage.getItem(DB_KEY);
        let dbParsed = null;
        if (existing) {
          try {
            dbParsed = JSON.parse(existing);
          } catch(e) {}
        }

        const defaultFields = {
          employees: [],
          clients: [],
          projects: [],
          agenda: [],
          weeklyGoals: [],
          tickets: [],
          knowledgeBase: [],
          referrals: [],
          notifications: [],
          auditLogs: []
        };

        const sanitizeDb = (rawDb) => {
          if (!rawDb) return null;
          const sanitized = { ...defaultFields, ...rawDb };
          for (const key of Object.keys(defaultFields)) {
            if (!Array.isArray(sanitized[key])) {
              sanitized[key] = [];
            }
          }
          // Sanitizar artículos de la wiki para asegurar compatibilidad de datos existentes
          if (Array.isArray(sanitized.knowledgeBase)) {
            sanitized.knowledgeBase = sanitized.knowledgeBase.map(item => {
              let tags = item.tags;
              if (typeof tags === 'string') {
                tags = tags.split(',').map(t => t.trim()).filter(t => t.length > 0);
              } else if (!Array.isArray(tags)) {
                tags = [];
              }
              return {
                ...item,
                tags,
                errorCode: item.errorCode || ''
              };
            });
          }
          return sanitized;
        };

        // If DB exists and version matches, use it
        if (dbParsed && dbParsed._version === DB_VERSION) {
          return sanitizeDb(dbParsed);
        }

        // Otherwise, create a clean database
        const db = {
          _version: DB_VERSION,
          ...defaultFields,
          employees: INITIAL_EMPLOYEES
        };

        localStorage.setItem(DB_KEY, JSON.stringify(db));
        return db;
      }

      // ==========================================
      // CONTEXTO GLOBAL DE LA APLICACIÓN
      // ==========================================
      const AppContext = createContext();

      function AppProvider({ children }) {
        const [db, setDb] = useState(null);
        const [loading, setLoading] = useState(true);
        const [splashActive, setSplashActive] = useState(true);
        const [isAuthenticated, setIsAuthenticated] = useState(false);
        const [currentUser, setCurrentUser] = useState(null);
        const [activeTab, setActiveTab] = useState('dashboard');
        const [theme, setTheme] = useState('dark');
        const notifications = db && currentUser
          ? (db.notifications || []).filter(n => !n.recipientId || n.recipientId === currentUser.id)
          : [];

        const addNotification = (text, recipientId = null) => {
          setDb(prevDb => {
            if (!prevDb) return prevDb;
            const newNotif = {
              id: `notif-${Date.now()}-${Math.random().toString(36).substr(2, 5)}`,
              text,
              read: false,
              time: new Date().toISOString().replace('T', ' ').substring(0, 16),
              recipientId
            };
            const updatedNotifs = [newNotif, ...(prevDb.notifications || [])];
            const nextDb = { ...prevDb, notifications: updatedNotifs.slice(0, 100) };
            nextDb._version = DB_VERSION;
            localStorage.setItem(DB_KEY, JSON.stringify(nextDb));
            return nextDb;
          });
        };

        const clearNotifications = () => {
          if (!currentUser) return;
          setDb(prevDb => {
            if (!prevDb) return prevDb;
            const updatedNotifs = (prevDb.notifications || []).map(n => {
              if (!n.recipientId || n.recipientId === currentUser.id) {
                return { ...n, read: true };
              }
              return n;
            });
            const nextDb = { ...prevDb, notifications: updatedNotifs };
            nextDb._version = DB_VERSION;
            localStorage.setItem(DB_KEY, JSON.stringify(nextDb));
            return nextDb;
          });
        };

        useEffect(() => {
          const splashTimer = setTimeout(() => {
            setSplashActive(false);
          }, 2500);

          async function load() {
            const data = await bootDatabase();
            setDb(data);
            setLoading(false);
          }
          load();

          return () => clearTimeout(splashTimer);
        }, []);

        useEffect(() => {
          document.documentElement.setAttribute('data-theme', theme);
        }, [theme]);

        const notifiedItems = useRef(new Set());

        // Background check for pending items every 60 seconds
        useEffect(() => {
          if (!isAuthenticated || !db) return;

          const runChecks = () => {
            const now = new Date();
            const todayStr = now.getFullYear() + '-' + 
              String(now.getMonth() + 1).padStart(2, '0') + '-' + 
              String(now.getDate()).padStart(2, '0');

            // 1. Tareas vencidas
            (db.projects || []).forEach(proj => {
              (proj.tasks || []).forEach(t => {
                if (t.status !== 'Completada' && t.deadline) {
                  const dl = new Date(t.deadline);
                  if (dl < now) {
                    const key = `task-overdue-${t.id}`;
                    if (!notifiedItems.current.has(key)) {
                      notifiedItems.current.add(key);
                      addNotification(`⚠️ Tarea vencida: "${t.title}" en proyecto ${proj.name}`);
                    }
                  }
                }
              });
            });

            // 2. Tickets abiertos > 72h
            (db.tickets || []).forEach(t => {
              if (t.status !== 'Cerrado' && t.createdAt) {
                const created = new Date(t.createdAt.replace(' ', 'T'));
                const diffMs = now - created;
                const diffHours = diffMs / (1000 * 60 * 60);
                if (diffHours > 72) {
                  const key = `ticket-aged-${t.id}`;
                  if (!notifiedItems.current.has(key)) {
                    notifiedItems.current.add(key);
                    addNotification(`⏰ Ticket envejecido: ${t.id} lleva más de 72h abierto`);
                  }
                }
              }
            });

            // 3. Agenda de hoy pendiente
            (db.agenda || []).forEach(act => {
              if (act.status === 'Pendiente' && act.date === todayStr) {
                const key = `agenda-today-${act.id}`;
                if (!notifiedItems.current.has(key)) {
                  notifiedItems.current.add(key);
                  addNotification(`📅 Actividad de agenda hoy: "${act.title}"`);
                }
              }
            });

            // 4. Inactividad de soporte de clientes normales (>30 días sin tickets o registro)
            (db.clients || []).forEach(client => {
              const type = client.clientType || 'Normal';
              if (type === 'Normal' && client.status === 'Activo') {
                const clientTickets = (db.tickets || []).filter(t => t.clientId === client.id);
                let daysInactive = 0;
                let hasRecent = false;
                
                if (clientTickets.length > 0) {
                  const dates = clientTickets.map(t => {
                    const dStr = t.createdAt ? t.createdAt.replace(' ', 'T') : null;
                    return dStr ? new Date(dStr) : new Date(0);
                  });
                  const maxDate = new Date(Math.max(...dates));
                  const diffMs = now - maxDate;
                  daysInactive = Math.floor(diffMs / (1000 * 60 * 60 * 24));
                  if (daysInactive > 30) {
                    hasRecent = true;
                  }
                } else {
                  const startStr = client.contractStart;
                  if (startStr) {
                    const startDate = new Date(startStr);
                    const diffMs = now - startDate;
                    daysInactive = Math.floor(diffMs / (1000 * 60 * 60 * 24));
                    if (daysInactive > 30) {
                      hasRecent = true;
                    }
                  } else {
                    const regTimestamp = parseInt(client.id.replace('cli-', ''), 10);
                    if (!isNaN(regTimestamp)) {
                      const diffMs = now - new Date(regTimestamp);
                      daysInactive = Math.floor(diffMs / (1000 * 60 * 60 * 24));
                      if (daysInactive > 30) {
                        hasRecent = true;
                      }
                    }
                  }
                }

                if (hasRecent) {
                  const key = `client-inactive-${client.id}-${daysInactive}`;
                  if (!notifiedItems.current.has(key)) {
                    notifiedItems.current.add(key);
                    addNotification(`⚠️ Inactividad: El cliente "${client.commercialName}" no ha generado tickets en más de 30 días (${daysInactive} días)`);
                  }
                }
              }
            });
          };

          runChecks();
          const interval = setInterval(runChecks, 60000);
          return () => clearInterval(interval);
        }, [isAuthenticated, db]);

        // Helper to persist DB consistently
        const saveDb = (updatedDb) => {
          updatedDb._version = DB_VERSION;
          setDb(updatedDb);
          localStorage.setItem(DB_KEY, JSON.stringify(updatedDb));
        };

        const logActivity = (action, details, userObject = currentUser, dbState = null) => {
          const targetDb = dbState || db;
          if (!targetDb) return null;
          const now = new Date();
          const timestamp = now.toISOString().replace('T', ' ').substring(0, 19);

          const newLog = {
            id: `aud-${Date.now()}`,
            timestamp,
            user: userObject ? `${userObject.name} (${userObject.role})` : 'Sistema',
            action,
            details
          };

          const updatedLogs = [newLog, ...targetDb.auditLogs];
          const updatedDb = { ...targetDb, auditLogs: updatedLogs };
          
          if (dbState) {
            return updatedDb;
          } else {
            saveDb(updatedDb);
            return updatedDb;
          }
        };

        const updateAgendaStatus = (id, status) => {
          const agendaItem = db.agenda.find(a => a.id === id);
          if (!agendaItem) return;
          
          const isAdminOrGerente = currentUser && (currentUser.role === 'Administrador' || currentUser.role === 'Gerente');
          const isAssignee = currentUser && currentUser.id === agendaItem.employeeId;

          if (!isAdminOrGerente && !isAssignee) {
            alert('Permiso denegado: no autorizado para actualizar esta actividad.');
            return;
          }

          const updatedAgenda = db.agenda.map(a => a.id === id ? { ...a, status } : a);
          let nextDb = { ...db, agenda: updatedAgenda };
          nextDb = logActivity('Planificación Agenda', `Actividad ID ${id} marcada como "${status}".`, currentUser, nextDb);
          saveDb(nextDb);

          if (agendaItem.employeeId && currentUser && currentUser.id !== agendaItem.employeeId) {
            addNotification(`Actividad "${agendaItem.title}" marcada como ${status} por ${currentUser.name}`, agendaItem.employeeId);
          }
        };

        const addAgendaItem = (item) => {
          const isAdminOrGerente = currentUser && (currentUser.role === 'Administrador' || currentUser.role === 'Gerente');
          const isSelfAssignment = currentUser && item.employeeId === currentUser.id;
          if (!isAdminOrGerente && !isSelfAssignment) {
            alert('Permiso denegado: no autorizado para programar actividades para otros empleados.');
            return;
          }
          const newItem = {
            id: `ag-${Date.now()}`,
            status: 'Pendiente',
            ...item
          };
          const updatedAgenda = [...db.agenda, newItem];
          let nextDb = { ...db, agenda: updatedAgenda };
          nextDb = logActivity('Planificación Agenda', `Nueva actividad creada: "${newItem.title}"`, currentUser, nextDb);
          saveDb(nextDb);

          if (newItem.employeeId && currentUser && currentUser.id !== newItem.employeeId) {
            addNotification(`${currentUser.name} te agendó una actividad: "${newItem.title}" para el ${newItem.date}`, newItem.employeeId);
          }
        };

        const updateAgendaItem = (id, updatedFields) => {
          const agendaItem = db.agenda.find(a => a.id === id);
          if (!agendaItem) return;

          const isAdminOrGerente = currentUser && (currentUser.role === 'Administrador' || currentUser.role === 'Gerente');
          const isAssignee = currentUser && currentUser.id === agendaItem.employeeId;

          if (!isAdminOrGerente && !isAssignee) {
            alert('Permiso denegado: no autorizado para editar esta actividad.');
            return;
          }

          const updatedAgenda = db.agenda.map(a => a.id === id ? { ...a, ...updatedFields } : a);
          let nextDb = { ...db, agenda: updatedAgenda };
          nextDb = logActivity('Planificación Agenda', `Actividad ID ${id} editada.`, currentUser, nextDb);
          saveDb(nextDb);

          if (agendaItem.employeeId && currentUser && currentUser.id !== agendaItem.employeeId) {
            addNotification(`Actividad "${agendaItem.title}" fue modificada por ${currentUser.name}`, agendaItem.employeeId);
          }
        };

        const rescheduleAgendaItem = (id, newDate) => {
          const agendaItem = db.agenda.find(a => a.id === id);
          if (!agendaItem) return;

          const isAdminOrGerente = currentUser && (currentUser.role === 'Administrador' || currentUser.role === 'Gerente');
          const isAssignee = currentUser && currentUser.id === agendaItem.employeeId;

          if (!isAdminOrGerente && !isAssignee) {
            alert('Permiso denegado: no autorizado para reprogramar esta actividad.');
            return;
          }
          const updatedAgenda = db.agenda.map(a => a.id === id ? { ...a, date: newDate, status: 'Reprogramado' } : a);
          let nextDb = { ...db, agenda: updatedAgenda };
          nextDb = logActivity('Planificación Agenda', `Actividad ID ${id} reprogramada para el ${newDate}.`, currentUser, nextDb);
          saveDb(nextDb);

          if (agendaItem.employeeId && currentUser && currentUser.id !== agendaItem.employeeId) {
            addNotification(`Actividad "${agendaItem.title}" fue reprogramada por ${currentUser.name} para el ${newDate}`, agendaItem.employeeId);
          }
        };

        const deleteAgendaItem = (id) => {
          const agendaItem = db.agenda.find(a => a.id === id);
          if (!agendaItem) return;

          const isAdminOrGerente = currentUser && (currentUser.role === 'Administrador' || currentUser.role === 'Gerente');
          const isAssignee = currentUser && currentUser.id === agendaItem.employeeId;

          if (!isAdminOrGerente && !isAssignee) {
            alert('Permiso denegado: no autorizado para eliminar esta actividad.');
            return;
          }
          const updatedAgenda = db.agenda.filter(a => a.id !== id);
          let nextDb = { ...db, agenda: updatedAgenda };
          nextDb = logActivity('Planificación Agenda', `Actividad ID ${id} eliminada.`, currentUser, nextDb);
          saveDb(nextDb);
        };

        const updateTaskStatus = (projectId, taskId, newStatus) => {
          const updatedProjects = db.projects.map(p => {
            if (p.id !== projectId) return p;
            const updatedTasks = p.tasks.map(t => {
              if (t.id !== taskId) return t;
              return { ...t, status: newStatus };
            });
            const completedCount = updatedTasks.filter(t => t.status === 'Completada').length;
            const progress = Math.round((completedCount / updatedTasks.length) * 100) || 0;
            return { ...p, tasks: updatedTasks, progress };
          });
          let nextDb = { ...db, projects: updatedProjects };
          nextDb = logActivity('Proyecto / Kanban', `Tarea ID ${taskId} movida a "${newStatus}".`, currentUser, nextDb);
          saveDb(nextDb);
        };

        const addProject = (proj) => {
          const newProj = {
            id: `proj-${Date.now()}`,
            status: 'En proceso',
            progress: 0,
            tasks: [],
            annotations: [],
            leadId: currentUser ? currentUser.id : 'master',
            leadName: currentUser ? currentUser.name : 'Master JC',
            ...proj
          };
          const updatedProjects = [...db.projects, newProj];
          let nextDb = { ...db, projects: updatedProjects };
          nextDb = logActivity('Gestión de Proyectos', `Proyecto creado: "${newProj.name}"`, currentUser, nextDb);
          saveDb(nextDb);
        };

        const deleteProject = (projId) => {
          const target = db.projects.find(p => p.id === projId);
          if (!target) return;
          const updatedProjects = db.projects.filter(p => p.id !== projId);
          let nextDb = { ...db, projects: updatedProjects };
          nextDb = logActivity('Gestión de Proyectos', `Proyecto eliminado: "${target.name}"`, currentUser, nextDb);
          saveDb(nextDb);
        };

        const addProjectAnnotation = (projectId, content) => {
          const now = new Date();
          const timestamp = now.getFullYear() + '-' + 
            String(now.getMonth() + 1).padStart(2, '0') + '-' + 
            String(now.getDate()).padStart(2, '0') + ' ' + 
            String(now.getHours()).padStart(2, '0') + ':' + 
            String(now.getMinutes()).padStart(2, '0');

          const newAnnotation = {
            id: `ann-${Date.now()}`,
            timestamp,
            user: currentUser ? currentUser.name : 'Sistema',
            content
          };

          const updatedProjects = db.projects.map(p => {
            if (p.id === projectId) {
              return {
                ...p,
                annotations: [newAnnotation, ...(p.annotations || [])]
              };
            }
            return p;
          });

          let nextDb = { ...db, projects: updatedProjects };
          nextDb = logActivity('Anotación de Proyecto', `Añadió anotación al proyecto ID ${projectId}`, currentUser, nextDb);
          saveDb(nextDb);
        };

        const addTaskToProject = (projectId, task) => {
          const newTask = {
            id: `t-${Date.now()}`,
            status: 'Pendiente',
            timeSpent: 0,
            subtasks: [],
            comments: [],
            assigneeId: currentUser ? currentUser.id : 'master',
            assigneeName: currentUser ? currentUser.name : 'Master JC',
            ...task
          };
          const updatedProjects = db.projects.map(p => {
            if (p.id !== projectId) return p;
            const updatedTasks = [...p.tasks, newTask];
            const completedCount = updatedTasks.filter(t => t.status === 'Completada').length;
            const progress = Math.round((completedCount / updatedTasks.length) * 100) || 0;
            return { ...p, tasks: updatedTasks, progress };
          });
          let nextDb = { ...db, projects: updatedProjects };
          nextDb = logActivity('Proyecto / Tareas', `Tarea "${newTask.title}" creada en proyecto ID ${projectId}.`, currentUser, nextDb);
          saveDb(nextDb);

          const project = db.projects.find(p => p.id === projectId);
          if (newTask.assigneeId && currentUser && currentUser.id !== newTask.assigneeId) {
            addNotification(`${currentUser.name} te asignó la tarea: "${newTask.title}" en el proyecto "${project ? project.name : ''}"`, newTask.assigneeId);
          }
        };

        const addTicket = (ticketData) => {
          let nextNum = 1001;
          if (db.tickets && db.tickets.length > 0) {
            const numbers = db.tickets.map(t => {
              const match = t.id.match(/\d+/);
              return match ? parseInt(match[0], 10) : 1000;
            });
            nextNum = Math.max(...numbers) + 1;
          }
          const newTicket = {
            id: `tck-${nextNum}`,
            status: 'Abierto',
            createdAt: new Date().toISOString().replace('T', ' ').substring(0, 16),
            history: [
              { action: 'Ticket creado', user: currentUser ? `${currentUser.name} (${currentUser.role})` : 'Sistema', date: new Date().toISOString().replace('T', ' ').substring(0, 16) }
            ],
            ...ticketData
          };
          const updatedTickets = [newTicket, ...db.tickets];
          let nextDb = { ...db, tickets: updatedTickets };
          nextDb = logActivity('Mesa de Tickets', `Ticket ID ${newTicket.id} creado: "${newTicket.title}".`, currentUser, nextDb);
          saveDb(nextDb);

          if (newTicket.assigneeId && currentUser && currentUser.id !== newTicket.assigneeId) {
            addNotification(`${currentUser.name} te asignó el ticket: "${newTicket.title}"`, newTicket.assigneeId);
          } else {
            addNotification(`Nuevo ticket de soporte: "${newTicket.title}" (${newTicket.clientName})`);
          }
        };

        const updateTicketStatus = (ticketId, status, comment) => {
          const updatedTickets = db.tickets.map(t => {
            if (t.id === ticketId) {
              const newHistory = {
                action: `Estado cambiado a ${status}${comment ? ' - ' + comment : ''}`,
                user: currentUser ? `${currentUser.name} (${currentUser.role})` : 'Sistema',
                date: new Date().toISOString().replace('T', ' ').substring(0, 16)
              };
              return {
                ...t,
                status,
                solution: status === 'Cerrado' ? comment : (t.solution || ''),
                history: [...t.history, newHistory]
              };
            }
            return t;
          });
          let nextDb = { ...db, tickets: updatedTickets };
          nextDb = logActivity('Actualización de Ticket', `Ticket ID ${ticketId} cambiado a "${status}".`, currentUser, nextDb);
          saveDb(nextDb);
        };


        const addReferral = (referral) => {
          const newReferral = {
            id: `ref-${Date.now()}`,
            date: new Date().toISOString().split('T')[0],
            status: 'Pendiente',
            employeeId: currentUser ? currentUser.id : 'master',
            employeeName: currentUser ? currentUser.name : 'Master JC',
            bonusAmount: parseFloat(referral.bonusAmount) || 0,
            clientName: referral.clientName,
            details: referral.details || '',
            approvedDate: null
          };
          const updatedReferrals = [...(db.referrals || []), newReferral];
          let nextDb = { ...db, referrals: updatedReferrals };
          nextDb = logActivity('Registro de Referido', `Empleado registró cliente referido: "${newReferral.clientName}" para bonificación de $${newReferral.bonusAmount}`, currentUser, nextDb);
          saveDb(nextDb);
        };

        const approveReferralBonus = (referralId, status) => {
          const isMaster = currentUser && currentUser.role === 'Administrador';
          if (!isMaster) {
            alert('Permiso denegado: solo master puede aprobar o rechazar bonos.');
            return;
          }
          const updatedReferrals = (db.referrals || []).map(ref => {
            if (ref.id === referralId) {
              return { 
                ...ref, 
                status, 
                approvedDate: status === 'Aprobado' ? new Date().toISOString().split('T')[0] : null 
              };
            }
            return ref;
          });
          
          const targetRef = (db.referrals || []).find(r => r.id === referralId);
          if (!targetRef) return;

          let nextDb = { ...db, referrals: updatedReferrals };
          nextDb = logActivity('Aprobación de Bono', `Bono del referido ID ${referralId} cambiado a "${status}".`, currentUser, nextDb);
          saveDb(nextDb);
        };

        const updateReferralBonus = (referralId, amount) => {
          const isMaster = currentUser && currentUser.role === 'Administrador';
          if (!isMaster) {
            alert('Permiso denegado: solo master puede editar bonos.');
            return;
          }
          const updatedReferrals = (db.referrals || []).map(ref => {
            if (ref.id === referralId) {
              return { 
                ...ref, 
                bonusAmount: parseFloat(amount) || 0
              };
            }
            return ref;
          });
          let nextDb = { ...db, referrals: updatedReferrals };
          nextDb = logActivity('Edición de Bono', `Monto del bono del referido ID ${referralId} modificado a $${amount}.`, currentUser, nextDb);
          saveDb(nextDb);
        };

        const checkRecurringIssues = (clientId, station, description) => {
          if (!db || !db.tickets || !description) return [];
          
          const stopwords = new Set([
            'el', 'la', 'los', 'las', 'un', 'una', 'unos', 'unas', 'de', 'del', 'al', 'y', 'o', 'en', 'para', 'con', 'no', 'si', 'su', 'sus', 'por', 'es', 'se', 'lo', 'que', 'a', 'como', 'con', 'del', 'las', 'los', 'por', 'con', 'fallo', 'error', 'falla', 'problema', 'jc', 'softway', 'soft'
          ]);

          const words = description
            .toLowerCase()
            .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "")
            .split(/\s+/)
            .filter(w => w.length > 2 && !stopwords.has(w));

          if (words.length === 0) return [];

          const sameClientTickets = db.tickets.filter(t => 
            t.clientId === clientId && 
            (t.status === 'Cerrado' || t.solution)
          );

          const matches = [];

          sameClientTickets.forEach(t => {
            let score = 0;
            const tDesc = (t.description || "").toLowerCase();
            const tTitle = (t.title || "").toLowerCase();
            
            words.forEach(word => {
              if (tDesc.includes(word) || tTitle.includes(word)) {
                score += 1;
              }
            });

            const sameStation = station && t.station && t.station.toLowerCase() === station.toLowerCase();
            if (sameStation) {
              score += 2;
            }

            if (score > 0) {
              matches.push({
                ticket: t,
                score,
                sameStation
              });
            }
          });

          matches.sort((a, b) => b.score - a.score);

          return matches.map(m => ({
            id: m.ticket.id,
            title: m.ticket.title,
            description: m.ticket.description,
            solution: m.ticket.solution || "No documentada",
            date: m.ticket.createdAt,
            station: m.ticket.station,
            score: m.score,
            sameStation: m.sameStation
          })).slice(0, 3);
        };

        const updateClientLayout = (clientId, layoutArray, logDetails = null) => {
          const updatedClients = db.clients.map(client => {
            if (client.id === clientId) {
              return { 
                ...client, 
                layout: layoutArray
              };
            }
            return client;
          });
          let nextDb = { ...db, clients: updatedClients };
          const details = logDetails || `Plano actualizado para el cliente ID: ${clientId}`;
          nextDb = logActivity('Plano de Instalación', details, currentUser, nextDb);
          saveDb(nextDb);
        };

        const updateClientTechnical = (clientId, infrastructure, credentials, files, layout, logAction = null, logDetails = null) => {
          const updatedClients = db.clients.map(client => {
            if (client.id === clientId) {
              return { 
                ...client, 
                infrastructure, 
                credentials,
                files: files !== undefined ? files : (client.files || []),
                layout: layout !== undefined ? layout : (client.layout || [])
              };
            }
            return client;
          });
          let nextDb = { ...db, clients: updatedClients };
          const action = logAction || 'Actualización Técnica';
          const details = logDetails || `Configuración técnica actualizada (infra, creds, archivos o planos) para cliente ID: ${clientId}`;
          nextDb = logActivity(action, details, currentUser, nextDb);
          saveDb(nextDb);
        };

        const addClientFollowUp = (clientId, comment) => {
          const today = new Date();
          const dateStr = today.getFullYear() + '-' + 
            String(today.getMonth() + 1).padStart(2, '0') + '-' + 
            String(today.getDate()).padStart(2, '0') + ' ' + 
            String(today.getHours()).padStart(2, '0') + ':' + 
            String(today.getMinutes()).padStart(2, '0');

          const newFollowUp = {
            id: Date.now(),
            date: dateStr,
            user: currentUser ? currentUser.name : 'Sistema',
            comment
          };

          const updatedClients = db.clients.map(client => {
            if (client.id === clientId) {
              return {
                ...client,
                followUps: [...(client.followUps || []), newFollowUp]
              };
            }
            return client;
          });

          let nextDb = { ...db, clients: updatedClients };
          nextDb = logActivity('Seguimiento Cliente', `Agregó comentario de seguimiento al cliente ID: ${clientId}`, currentUser, nextDb);
          saveDb(nextDb);

          const client = db.clients.find(c => c.id === clientId);
          if (client && currentUser) {
            addNotification(`${currentUser.name} agregó nota de seguimiento a ${client.commercialName}: "${comment}"`);
          }
        };

        const addEmployee = (emp) => {
          const newEmp = {
            id: `usr-${Date.now()}`,
            productivity: { completed: 0, active: 0, performance: 100 },
            ...emp
          };
          const updatedEmployees = [...db.employees, newEmp];
          let nextDb = { ...db, employees: updatedEmployees };
          nextDb = logActivity('Gestión de Usuarios', `Usuario creado: ${newEmp.name} (${newEmp.role})`, currentUser, nextDb);
          saveDb(nextDb);
        };

        const updateEmployee = (empId, updated) => {
          const updatedEmployees = db.employees.map(e => e.id === empId ? { ...e, ...updated } : e);
          let nextDb = { ...db, employees: updatedEmployees };
          nextDb = logActivity('Gestión de Usuarios', `Usuario actualizado: ${updated.name}`, currentUser, nextDb);
          saveDb(nextDb);
        };

        const deleteEmployee = (empId) => {
          const target = db.employees.find(e => e.id === empId);
          if (!target) return;
          const updatedEmployees = db.employees.filter(e => e.id !== empId);
          let nextDb = { ...db, employees: updatedEmployees };
          nextDb = logActivity('Gestión de Usuarios', `Usuario eliminado: ${target.name}`, currentUser, nextDb);
          saveDb(nextDb);
        };

        const addClient = (cli) => {
          const newCli = {
            id: `cli-${Date.now()}`,
            status: 'Activo',
            infrastructure: { servers: [], vpn: null },
            credentials: [],
            ...cli
          };
          const updatedClients = [...db.clients, newCli];
          let nextDb = { ...db, clients: updatedClients };
          nextDb = logActivity('Gestión de Clientes', `Cliente creado: ${newCli.commercialName}`, currentUser, nextDb);
          saveDb(nextDb);
        };

        const updateClient = (cliId, updated) => {
          const updatedClients = db.clients.map(c => c.id === cliId ? { ...c, ...updated } : c);
          let nextDb = { ...db, clients: updatedClients };
          nextDb = logActivity('Gestión de Clientes', `Cliente actualizado: ${updated.commercialName}`, currentUser, nextDb);
          saveDb(nextDb);
        };

        const deleteClient = (cliId) => {
          const target = db.clients.find(c => c.id === cliId);
          if (!target) return;
          const updatedClients = db.clients.filter(c => c.id !== cliId);
          let nextDb = { ...db, clients: updatedClients };
          nextDb = logActivity('Gestión de Clientes', `Cliente eliminado: ${target.commercialName}`, currentUser, nextDb);
          saveDb(nextDb);
        };

        const addClientServer = (cliId, server) => {
          const updatedClients = db.clients.map(c => {
            if (c.id !== cliId) return c;
            const servers = [...(c.infrastructure?.servers || []), server];
            return { ...c, infrastructure: { ...c.infrastructure, servers } };
          });
          let nextDb = { ...db, clients: updatedClients };
          nextDb = logActivity('Infraestructura Cliente', `Servidor "${server.name}" agregado al cliente ID ${cliId}`, currentUser, nextDb);
          saveDb(nextDb);
        };

        const addClientCredential = async (cliId, cred) => {
          const encPassword = await encryptLocal(cred.password);
          const newCred = {
            id: `cred-${Date.now()}`,
            label: cred.label,
            username: cred.username,
            password: encPassword
          };
          const updatedClients = db.clients.map(c => {
            if (c.id !== cliId) return c;
            const credentials = [...(c.credentials || []), newCred];
            return { ...c, credentials };
          });
          let nextDb = { ...db, clients: updatedClients };
          nextDb = logActivity('Bóveda de Credenciales', `Credencial "${cred.label}" agregada al cliente ID ${cliId}`, currentUser, nextDb);
          saveDb(nextDb);
        };

        const addWikiArticle = (art) => {
          const newArt = {
            id: `kb-${Date.now()}`,
            lastUpdated: new Date().toISOString().substring(0, 10),
            author: currentUser ? currentUser.name : 'Sistema',
            ...art,
            tags: typeof art.tags === 'string'
              ? art.tags.split(',').map(t => t.trim()).filter(t => t.length > 0)
              : (Array.isArray(art.tags) ? art.tags : []),
            errorCode: art.errorCode ? art.errorCode.trim() : ''
          };
          const updatedKb = [...db.knowledgeBase, newArt];
          let nextDb = { ...db, knowledgeBase: updatedKb };
          nextDb = logActivity('Wiki Conocimiento', `Artículo creado: "${newArt.title}"`, currentUser, nextDb);
          saveDb(nextDb);
        };

        return (
          <AppContext.Provider value={{
            db, setDb, saveDb, loading, splashActive, isAuthenticated, setIsAuthenticated,
            currentUser, setCurrentUser, activeTab, setActiveTab,
            theme, setTheme, notifications, clearNotifications, logActivity,
            updateAgendaStatus, addAgendaItem, updateAgendaItem, rescheduleAgendaItem, deleteAgendaItem,
            updateTaskStatus, addProject, deleteProject, addProjectAnnotation, addTaskToProject,
            addTicket, updateTicketStatus, addReferral, approveReferralBonus, updateReferralBonus, checkRecurringIssues,
            addEmployee, updateEmployee, deleteEmployee,
            addClient, updateClient, deleteClient, addClientServer, addClientCredential,
            updateClientLayout, addWikiArticle, updateClientTechnical, addClientFollowUp
          }}>
            {children}
          </AppContext.Provider>
        );
      }

      // 1. LOGIN
      function Login() {
        const { db, setCurrentUser, setIsAuthenticated, logActivity } = useContext(AppContext);
        const [email, setEmail] = useState('');
        const [password, setPassword] = useState('');
        const [error, setError] = useState('');
        const [showPassword, setShowPassword] = useState(false);

        if (!db) return null;

        const handleLoginSubmit = (e) => {
          e.preventDefault();
          setError('');

          const user = db.employees.find(
            emp => emp.email.toLowerCase() === email.trim().toLowerCase() || 
                   (emp.username && emp.username.toLowerCase() === email.trim().toLowerCase())
          );

          if (!user) {
            setError('Usuario no encontrado');
            return;
          }

          if (user.password !== password) {
            setError('Contraseña incorrecta');
            return;
          }

          if (user.status !== 'Activo') {
            setError('Su usuario está inactivo. Contacte al administrador.');
            return;
          }

          setCurrentUser(user);
          setIsAuthenticated(true);
          logActivity('Inicio Sesión', `Acceso concedido a ${user.name} (${user.role})`, user);
        };

      function Dashboard() {
        const { db, currentUser, updateAgendaStatus, setActiveTab } = useContext(AppContext);
        if (!db || !currentUser) return null;

        const isAdminOrGerente = currentUser.role === 'Administrador' || currentUser.role === 'Gerente';

        const myAgenda = db.agenda.filter(a => a.employeeId === currentUser.id);
        const openTickets = db.tickets.filter(t => t.status !== 'Cerrado');

        const todayVal = new Date();
        const todayStr = todayVal.getFullYear() + '-' + 
          String(todayVal.getMonth() + 1).padStart(2, '0') + '-' + 
          String(todayVal.getDate()).padStart(2, '0');

        // 1. Visitas de Hoy
        const todayVisits = db.agenda 
          ? db.agenda.filter(act => {
              const isToday = act.date === todayStr;
              const isActive = act.status !== 'Completado' && act.status !== 'Cancelado';
              const isAssignee = isAdminOrGerente ? true : act.employeeId === currentUser.id;
              return isToday && isActive && isAssignee;
            })
          : [];

        // 2. Clientes Inactivos (>30 días sin tickets)
        const inactiveClients = db.clients
          ? db.clients.filter(client => {
              const type = client.clientType || 'Normal';
              if (type !== 'Normal' || client.status !== 'Activo') return false;
              
              const clientTickets = (db.tickets || []).filter(t => t.clientId === client.id);
              let daysInactive = 0;
              
              if (clientTickets.length > 0) {
                const dates = clientTickets.map(t => {
                  const dStr = t.createdAt ? t.createdAt.replace(' ', 'T') : null;
                  return dStr ? new Date(dStr) : new Date(0);
                });
                const maxDate = new Date(Math.max(...dates));
                const diffMs = todayVal - maxDate;
                daysInactive = Math.floor(diffMs / (1000 * 60 * 60 * 24));
              } else {
                const startStr = client.contractStart;
                if (startStr) {
                  const startDate = new Date(startStr);
                  const diffMs = todayVal - startDate;
                  daysInactive = Math.floor(diffMs / (1000 * 60 * 60 * 24));
                } else {
                  const regTimestamp = parseInt(client.id.replace('cli-', ''), 10);
                  if (!isNaN(regTimestamp)) {
                    const diffMs = todayVal - new Date(regTimestamp);
                    daysInactive = Math.floor(diffMs / (1000 * 60 * 60 * 24));
                  }
                }
              }
              
              return daysInactive > 30;
            }).map(client => {
              const clientTickets = (db.tickets || []).filter(t => t.clientId === client.id);
              let daysInactive = 0;
              if (clientTickets.length > 0) {
                const dates = clientTickets.map(t => {
                  const dStr = t.createdAt ? t.createdAt.replace(' ', 'T') : null;
                  return dStr ? new Date(dStr) : new Date(0);
                });
                const maxDate = new Date(Math.max(...dates));
                const diffMs = todayVal - maxDate;
                daysInactive = Math.floor(diffMs / (1000 * 60 * 60 * 24));
              } else {
                const startStr = client.contractStart;
                if (startStr) {
                  const startDate = new Date(startStr);
                  const diffMs = todayVal - startDate;
                  daysInactive = Math.floor(diffMs / (1000 * 60 * 60 * 24));
                } else {
                  const regTimestamp = parseInt(client.id.replace('cli-', ''), 10);
                  if (!isNaN(regTimestamp)) {
                    const diffMs = todayVal - new Date(regTimestamp);
                    daysInactive = Math.floor(diffMs / (1000 * 60 * 60 * 24));
                  }
                }
              }
              return { ...client, daysInactive };
            })
          : [];

        // 3. Tickets Envejecidos (>72 horas de antigüedad)
        const agedTickets = db.tickets
          ? db.tickets.filter(t => {
              if (t.status === 'Cerrado' || !t.createdAt) return false;
              const isAssignee = isAdminOrGerente ? true : t.assigneeId === currentUser.id;
              if (!isAssignee) return false;

              const created = new Date(t.createdAt.replace(' ', 'T'));
              const diffMs = todayVal - created;
              const diffHours = diffMs / (1000 * 60 * 60);
              return diffHours > 72;
            }).map(t => {
              const created = new Date(t.createdAt.replace(' ', 'T'));
              const diffMs = todayVal - created;
              const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
              return { ...t, diffHours };
            })
          : [];

        return (

            {currentUser.role !== 'Cliente' && (

                  📢 Recordatorios Diarios de Clientes

                {(todayVisits.length === 0 && inactiveClients.length === 0 && agedTickets.length === 0) ? (
                  <p style={{ fontSize: '0.75rem', color: 'var(--text-muted)', margin: 0, fontStyle: 'italic' }}>
                    ✅ No hay alertas o recordatorios para el día de hoy. ¡Todo al día!
                  </p>
                ) : (
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                    {todayVisits.map(act => (
                      <div 
                        key={act.id} 
                        onClick={() => setActiveTab('agenda')}
                        style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '8px 12px', backgroundColor: 'var(--background)', border: '1px solid var(--border)', borderRadius: 'var(--radius-xs)', cursor: 'pointer' }}
                      >
                        <div style={{ display: 'flex', alignItems: 'center', gap: '8px', fontSize: '0.75rem' }}>
                          <span>📅</span>
                          <div>
                            <strong>Visita de Hoy:</strong> {act.title} {act.clientName && ` - ${act.clientName}`}
                            <div style={{ fontSize: '0.65rem', color: 'var(--text-muted)', marginTop: '2px' }}>
                              Horario: {act.time} | Asignado a: {db.employees.find(e => e.id === act.employeeId)?.name || 'Sin asignar'}
                            </div>
                          </div>
                        </div>
                        <span className="badge badge-info" style={{ fontSize: '0.6rem' }}>Pendiente</span>

                    {inactiveClients.map(client => (
                      <div 
                        key={client.id} 
                        onClick={() => setActiveTab('clients')}
                        style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '8px 12px', backgroundColor: 'var(--background)', border: '1px solid var(--border)', borderRadius: 'var(--radius-xs)', cursor: 'pointer' }}
                      >

                          <span>⚠️</span>
                          <div>
                            <strong>Inactividad Comercial:</strong> {client.commercialName}
                            <div style={{ fontSize: '0.65rem', color: 'var(--text-muted)', marginTop: '2px' }}>
                              Sin tickets de soporte desde hace <strong style={{ color: 'var(--warning)' }}>{client.daysInactive} días</strong>.
                            </div>
                          </div>
                        </div>
                        <span className="badge badge-warning" style={{ fontSize: '0.6rem' }}>Seguimiento</span>
                      </div>
                    ))}
                    {agedTickets.map(t => (
                      <div

                        style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '8px 12px', backgroundColor: 'var(--background)', border: '1px solid var(--border)', borderRadius: 'var(--radius-xs)', cursor: 'pointer' }}
                      >

                            <div style={{ fontSize: '0.65rem', color: 'var(--text-muted)', marginTop: '2px' }}>
                              Abierto hace <strong style={{ color: 'var(--danger)' }}>{t.diffHours} horas</strong>. Cliente: {t.clientName}
                            </div>
                          </div>
                        </div>
                        <span className="badge badge-danger" style={{ fontSize: '0.6rem' }}>Añejo</span>
                      </div>
                    ))}
                  </div>
                )}

            )}

            <div className="metrics-grid">

            activeClient.infrastructure,

        const handleRevealCredential = async (cred) => {
          if (revealedCreds[cred.id]) {
            const updated = { ...revealedCreds };
            delete updated[cred.id];
            setRevealedCreds(updated);
            return;
          }

          setLoadingCreds(prev => ({ ...prev, [cred.id]: true }));
          const plainText = await decryptLocal(cred.password);
          
          setRevealedCreds(prev => ({ ...prev, [cred.id]: plainText }));
          setLoadingCreds(prev => ({ ...prev, [cred.id]: false }));

          logActivity(
